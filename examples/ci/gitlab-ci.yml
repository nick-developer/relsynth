# .gitlab-ci.yml: nightly synthetic test database with a quality gate.
# CI/CD variables (masked, protected): PGPASSWORD, TEST_DB_URL.
stages: [check, synthesise]

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet "relsynth[postgres]==1.0.0"

check-spec:
  stage: check
  script:
    - relsynth check synthetic/spec.yaml --connect --json
  rules:
    - changes: [synthetic/spec.yaml]
    - if: $CI_PIPELINE_SOURCE == "schedule"

synthesise:
  stage: synthesise
  script:
    - relsynth run synthetic/spec.yaml --target-url-env TEST_DB_URL --fail-under 0.98
        --bundle diagnostics_bundle.json --report scorecard.md --json > run.json
  after_script:
    - test -f diagnostics_bundle.json && relsynth doctor diagnostics_bundle.json --spec synthetic/spec.yaml --report doctor.md || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [run.json, scorecard.md, doctor.md, diagnostics_bundle.json]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
