  - id: PRV-09
    doc: docs/privacy.md
    area: privacy-measured
    quote:
      - "The privacy unit is the table that holds the people"
      - "Every table that reaches it through foreign keys belongs to it: a customer's invoices and invoice lines are attacked together with the customer."
      - "Chains stop at other person tables: a customer's sales representative does not own the customer."
    status: supported
    evidence:
