      - check: C803
      - test: tests/unit/governance/test_governance.py::test_tampered_registry_is_detected
      - test: tests/unit/governance/test_governance.py::test_tampered_report_or_manifest_object_is_detected

  - id: GOV-02
    doc: docs/governance/guide.md
    area: governance
    quote:
