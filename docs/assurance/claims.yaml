      - check: C601
      - test: tests/unit/test_privacy.py::test_wilson_and_residual_match_anonymeter_formulas
      - report: docs/assurance/evidence/T06/repro_anonymeter.json
      - source: "EDPB Guidelines 02/2026 v1.0, sec. 3.4.1, paras. 54-57"

  - id: PRV-05
    doc: docs/privacy.md
    area: privacy-measured
    quote: "| No linkage (sec. 3.4.2) | Can someone connect two records about one person?"
    status: supported
    evidence:
