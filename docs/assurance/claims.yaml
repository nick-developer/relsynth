  - id: SEC-15
    doc: docs/security.md
    area: security
    quote: "subprocess runs fixed argument lists, never a shell, in four places: pdflatex (when present) for the exported model's PDF, the OPA binary when the policy engine is opa, the GPU listing commands of relsynth compute, and the service worker's job runner."
    status: supported
