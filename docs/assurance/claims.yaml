  # ------------------------------------------------------------------ docs/governance/guide.md (T08)

  - id: GOV-01
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "relsynth can record every run in a registry: a folder with signed run manifests, the organisation's privacy budget, approvals and releases, kept in a hash chain so that any later change is detected."
    status: supported
    evidence:
