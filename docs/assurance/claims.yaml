    quote:
    - 'python -m bench.agents drafts each database with its catalog hidden (benchmark mode), lets the review agent answer, and compares every answer about a key or a link with ground truth the agent does not see: the declared catalog of Chinook, AdventureWorks DW and Contoso, and the hand-reviewed spec of bi/COREP.'
