      - test: tests/unit/test_governance_design.py::test_example_policy_and_manifest_validate

  - id: GOV-07
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "On allow it signs a release token and writes the package: the synthetic tables byte for byte as signed, the manifest, the approvals, the token, a checkpoint, and the DP statement for DP runs."
      - "The privacy report never goes into a package: it was computed on real data."
    status: supported
    evidence:
      - test: tests/unit/governance/test_governance.py::test_external_dp_release_with_quorum_and_token
      - test: tests/unit/governance/test_governance.py::test_privacy_report_cannot_leave_the_organisation

  - id: GOV-08
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "Revoking never refunds privacy budget, because the data has already left."
      - "Budget is reserved before a DP run reads data and refunded only if it never read any (Proposition 802)."
    status: supported
    evidence:
