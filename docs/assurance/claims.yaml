      - check: C600
      - test: tests/unit/test_privacy.py::test_unit_paths_and_split_keep_people_whole
      - test: tests/unit/test_privacy.py::test_unit_chain_stops_at_other_person_tables

  - id: PRV-10
    doc: docs/privacy.md
    area: privacy-measured
    quote: "Profiles hold no key values, because synthetic keys are new labels."
    status: supported
    evidence:
