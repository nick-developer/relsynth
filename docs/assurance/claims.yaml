  - id: GOV-05
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "A context outside the organisation is refused unless the run is differentially private (--epsilon, --dp or a dp section; see dp.md)."
      - "Without either, the verdict is missing and the run cannot be released."
      - "context \"partner\" is outside the organisation: differential privacy is required, and this run has none"
    status: supported
