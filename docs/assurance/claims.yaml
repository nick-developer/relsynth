      - test: tests/unit/governance/test_governance.py::test_ledger_lifetime_cap_under_concurrency
      - source: "NIST SP 800-226, sec. 2.2 (no rule for choosing epsilon)"
    note: The ε ranges are the deployment practice NIST SP 800-226 reports, not something relsynth proves.

  - id: GOV-11
