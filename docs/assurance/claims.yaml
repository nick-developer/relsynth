      - test: tests/unit/governance/test_governance.py::test_policy_must_be_signed_by_privacy_owner
      - test: tests/unit/test_governance_design.py::test_budget_has_no_default_and_bounded_delta
      - test: tests/unit/governance/test_governance.py::test_cli_end_to_end

  - id: GOV-04
    doc: docs/governance/guide.md
    area: governance
    quote: "Four invariants hold whatever the policy says: an external release needs DP, an external release needs an approval by someone other than the operator, a fail or blocked privacy verdict is never released, and no domain may exceed its lifetime budget."
    status: supported
    evidence:
      - test: tests/unit/governance/test_governance.py::test_invariants_hold_under_a_permissive_policy
      - test: tests/unit/governance/test_governance.py::test_failed_verdict_quality_and_target_are_refused
      - test: tests/unit/test_governance_design.py::test_external_context_cannot_waive_dp_or_approval
      - test: tests/unit/governance/test_policy_parity.py::test_builtin_engine_matches_fixture

  - id: GOV-05
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "A context outside the organisation is refused unless the run is differentially private (--epsilon, --dp or a dp section; see dp.md)."
      - "Without either, the verdict is missing and the run cannot be released."
      - "context \"partner\" is outside the organisation: differential privacy is required, and this run has none"
    status: supported
    evidence:
      - test: tests/unit/governance/test_governance.py::test_partner_without_dp_is_refused
      - test: tests/unit/governance/test_governance.py::test_failed_verdict_quality_and_target_are_refused

  - id: GOV-06
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "The run writes its synthetic data as usual and then records a signed manifest: hashes of the outputs and the spec, versions, seeds, the verdicts, the quality score and what the policy still needs before a release."
      - "The manifest holds no data, no row counts and no credentials."
    status: supported
    evidence:
