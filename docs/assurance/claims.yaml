      - test: tests/unit/governance/test_governance.py::test_failed_verdict_quality_and_target_are_refused

  - id: GOV-06
    doc: docs/governance/guide.md
    area: governance
    quote:
      - "The run writes its synthetic data as usual and then records a signed manifest: hashes of the outputs and the spec, versions, seeds, the verdicts, the quality score and what the policy still needs before a release."
      - "The manifest holds no data, no row counts and no credentials."
    status: supported
