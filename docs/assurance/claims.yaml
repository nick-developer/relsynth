      - test: tests/unit/governance/test_governance.py::test_rejection_and_revocation

  - id: GOV-09
    doc: docs/governance/guide.md
    area: governance
    quote: "A registry check catches edited, deleted, inserted, reordered and truncated log entries and any changed report or manifest (Proposition 803, check C803)."
