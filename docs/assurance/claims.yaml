  - id: GOV-10
    doc: docs/governance/guide.md
    area: privacy-formal
    quote:
      - "Values below 1 give strong protection; deployments use 1 < ε ≤ 20, and the risk above 1 should be measured, for example with relsynth privacy."
      - "δ should be at most 1/n² for n people and never above 10⁻⁵ (the policy schema refuses more)."
      - "The lifetime cap never resets; a period cap only spreads it over time (Proposition 801)."
