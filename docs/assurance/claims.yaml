      - check: C605
      - test: tests/unit/test_privacy.py::test_profiles_ignore_keys_and_row_order

  - id: PRV-11
    doc: docs/privacy.md
    area: privacy-measured
    quote:
      - "Control people are never seen: the attacks' success on them is what the synthetic data teaches about anyone, and only the excess on training people is a risk to them."
      - "Training and control have the same size so the record-isolation rates are exactly comparable (Prop. 601); Anonymeter's fitted size correction showed risks of 0.10–0.14 under the null in our checks."
    status: supported
    evidence:
      - prop: prop:puctrl
      - check: C601
      - report: docs/assurance/evidence/T06/repro_anonymeter.json

  - id: PRV-12
    doc: docs/privacy.md
    area: privacy-measured
    quote:
      - "It never assumes a less motivated attacker (para. 31)."
      - "Each check compares the upper confidence bound with the limit (safety margin, para. 88):"
      - "pass when it is below, fail when even the lower bound is above, review otherwise."
    status: supported
    evidence:
      - test: tests/unit/test_privacy.py::test_assess_report_and_contexts
      - test: tests/unit/test_privacy.py::test_review_sign_off_per_person_and_small_population
      - source: "EDPB Guidelines 02/2026 v1.0, para. 31 (motivation), para. 88 (safety margins)"

  - id: PRV-13
    doc: docs/privacy.md
    area: governance
    quote: "Contexts outside the organisation are blocked unless the release carries a differential-privacy guarantee: the organisation decided that DP is required for every external release, with ε set by the organisation (there is no built-in ε)."
    status: supported
    evidence:
      - test: tests/unit/test_privacy.py::test_assess_report_and_contexts
      - test: tests/unit/test_privacy.py::test_assess_with_dp_is_not_blocked
      - test: tests/unit/governance/test_governance.py::test_partner_without_dp_is_refused

  - id: PRV-14
    doc: docs/privacy.md
    area: governance
    quote: "A named person (the DPO) signs off a review with relsynth privacy ... --signed-off-by \"Name, DPO\"; the report records the name."
    status: supported
    evidence:
      - test: tests/unit/test_privacy.py::test_review_sign_off_per_person_and_small_population

  - id: PRV-15
    doc: docs/privacy.md
    area: privacy-measured
    quote: "With fewer than small_population (1000) people in the unit, the report warns, and every context outside the organisation fails without DP (check small_population)."
    status: supported
    evidence:
      - test: tests/unit/test_privacy.py::test_review_sign_off_per_person_and_small_population

  - id: PRV-16
    doc: docs/privacy.md
    area: privacy-formal
    quote:
      - "When the release carries a DP guarantee (release.dp: {epsilon, delta}), the page also shows the largest TPR any attack can reach at FPR 1% (Kairouz et al. 2015; Prop. 603)."
      - "With cumulative_epsilon (and cumulative_delta), the budget spent by all releases from the same domain so far, it also shows the bound for all of them together, since releases about the same people compose."
    status: supported
    evidence:
