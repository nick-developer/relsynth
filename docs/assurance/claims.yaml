    - 'Both wrong answers are links that hold on every row but that the ground truth leaves out:'
    - A reviewer who accepts only the answers not flagged for attention would accept the second one, which adds no change to the spec because the draft already holds the link.
    - Of 92 lookups, derive, check and aggregate rules, constants, dates and key orders across the four databases, 90 held on every row.
    status: supported
    note: Measured with the rules backend on 2026-11-01; the model backend is measured in the CI job agents, not claimed. Sampling in introspection can change the draft's items between runs.
    evidence:
    - report: docs/assurance/evidence/T16/agents-summary-rules.json
    - report: docs/assurance/evidence/T16/agents-adventureworks-rules.json
    - report: docs/assurance/evidence/T16/agents-bi_corep_lr-rules.json
    - report: docs/assurance/evidence/T16/agents-chinook-rules.json
    - report: docs/assurance/evidence/T16/agents-contoso_sqlite-rules.json
  - id: AGT-14
    doc: docs/agents.md
    area: scope
    quote:
    - Rule items have no independent ground truth, because the agent measures them on every row.
    - 'Links that introspection did not ask about cannot be answered: on the toy test database customer.support_rep is missing from the draft, and the evaluation reports such links separately.'
    - The agents do not judge whether a column holds personal data; that stays a privacy decision.
    status: limitation
    evidence:
    - test: tests/unit/agents/test_agents.py::test_review_toy_against_catalog
    - check: C1601
  - id: AGT-15
    doc: README.md
    area: structure
    quote:
    - 'review answers the review: items of an introspected draft (keys, links, lookups, rules, ASK questions) with evidence measured on every row, and proposes the change each answer implies.'
    - relsynth agent apply --by <person> applies the answers that person accepts.
    - explain words a quality, privacy or scorecard report in plain language; doctor turns doctor findings into proposals (privacy settings become advice for the privacy officer); draft contract and draft policy write an ODCS contract and an organisation policy with every budget left empty.
    status: supported
    evidence:
    - claim: AGT-02
    - claim: AGT-03
    - test: tests/unit/agents/test_agents.py::test_doctor_proposals_hold_back_privacy_fixes
    - test: tests/unit/agents/test_agents.py::test_cli_review_apply_explain_draft
  - id: AGT-16
    doc: README.md
    area: security
    quote:
    - 'Agents never see rows: they get names and whole-column aggregates, and single values only in the values scope when they occur at least 10 times.'
    - In the service an agent account can read and propose only, and in the governance registry an agent key cannot approve.
    - A prompt-injection suite runs 20 payloads against a model that obeys every instruction.
    status: supported
    evidence:
    - claim: AGT-06
    - claim: AGT-01
    - claim: AGT-10
  - id: AGT-17
    doc: README.md
    area: statistics
    quote: With the catalog hidden, the rules backend's answers about keys and links matched the ground truth on 122 of 124 answered items on Chinook, AdventureWorks DW, Contoso and bi/COREP
    status: supported
    evidence:
    - claim: AGT-13

