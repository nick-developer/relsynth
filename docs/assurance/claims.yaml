# Claim register: every claim of the documents in `scope` traced to its evidence.
#
# Checked by `python tools/claims_check.py` (CI job `lint`, and tests/unit/test_assurance.py).
# How to keep it green, and what each field means: docs/assurance/README.md#the-claim-register.
#
#   id        stable identifier, cited by the assurance case (AC-...) and the regulation mapping
#   doc       the document that makes the claim
#   quote     the claim's words (one string or a list); must still appear in `doc`
#   area      structure | statistics | privacy-measured | privacy-formal | governance | security | scope
#   status    supported   the evidence establishes the claim as written
#             partial     the evidence establishes part of it; `note` says which part is open
#             limitation  the claim states a limit of relsynth; the evidence shows the limit is enforced or measured
#             scope       says what a source (a regulation, a paper) says, not what relsynth does
#   evidence  list of {prop: label} {check: Cnnn} {test: file::name} {report: path} {code: file::symbol} {source: text}
#             {claim: ID} (a summary of another registered claim; as strong as that claim)
#   note      optional: what the evidence does not show

scope:
  - docs/privacy.md
  - docs/dp.md
  - docs/security.md
  - docs/governance/guide.md
  - README.md

claims:

  # ------------------------------------------------------------------ docs/privacy.md (measured privacy, T06)

  - id: PRV-01
    doc: docs/privacy.md
    area: privacy-measured
    quote: "relsynth privacy attacks a synthetic release the way a recipient could, person by person, and writes a privacy report with one page per release context (internal, partner, public)."
    status: supported
    evidence:
      - test: tests/unit/test_privacy.py::test_assess_report_and_contexts
      - test: tests/unit/test_privacy.py::test_cli_privacy_writes_report_and_gates

  - id: PRV-02
    doc: docs/privacy.md
    area: privacy-measured
    quote: "A data protection officer can read the pages without the annex; the annex and the JSON file hold the technical results."
    status: partial
    note: Readability by a DPO is a design aim; the test shows the report's structure (one page per context, annex, JSON), not that it is readable.
    evidence:
      - test: tests/unit/test_privacy.py::test_assess_report_and_contexts

  - id: PRV-03
    doc: docs/privacy.md
    area: privacy-measured
    quote:
      - "The report never shows a real key."
      - "People are named by keyed hashes (P-3f2a…, HMAC-SHA256 of the key) under a secret 256-bit salt that is not the split seed"
    status: supported
    evidence:
      - test: tests/unit/test_privacy.py::test_assess_report_and_contexts
      - test: tests/unit/test_privacy.py::test_cli_privacy_writes_report_and_gates

  - id: PRV-04
    doc: docs/privacy.md
    area: privacy-measured
    quote: "| No record isolation (sec. 3.4.1) | Can someone single out a real person?"
    status: supported
    evidence:
