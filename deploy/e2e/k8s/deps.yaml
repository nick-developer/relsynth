# Test dependencies of the Kubernetes end-to-end run (deploy/e2e/k8s-e2e.sh):
# a metadata PostgreSQL, a source PostgreSQL with the demo shop, and Keycloak.
# Demo credentials come from the Secret "e2e-passwords" that the script creates.
apiVersion: apps/v1
kind: Deployment
metadata: {name: metadata}
spec:
  selector: {matchLabels: {app: metadata}}
  template:
    metadata: {labels: {app: metadata}}
    spec:
      containers:
        - name: pg
          image: postgres:16-alpine
          imagePullPolicy: Never
          env:
            - {name: POSTGRES_USER, value: relsynth}
            - {name: POSTGRES_DB, value: relsynth}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: e2e-passwords, key: metadata}}
          readinessProbe: {exec: {command: [pg_isready, -U, relsynth]}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: metadata}
spec: {selector: {app: metadata}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sources}
spec:
  selector: {matchLabels: {app: sources}}
  template:
    metadata: {labels: {app: sources}}
    spec:
      containers:
        - name: pg
          image: postgres:16-alpine
          imagePullPolicy: Never
          env:
            - {name: POSTGRES_USER, value: reader}
            - {name: POSTGRES_DB, value: shop}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: shop-db, key: password}}
          volumeMounts: [{name: init, mountPath: /docker-entrypoint-initdb.d}]
          readinessProbe: {exec: {command: [pg_isready, -U, reader, -d, shop]}, periodSeconds: 3}
      volumes: [{name: init, configMap: {name: shop-sql}}]
---
apiVersion: v1
kind: Service
metadata: {name: sources}
spec: {selector: {app: sources}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak}
spec:
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: kc
          image: keycloak/keycloak:26.0.7
          imagePullPolicy: Never
          args: [start-dev, --import-realm, --hostname=http://localhost:30081, --hostname-backchannel-dynamic=true, --health-enabled=true]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: e2e-passwords, key: keycloak}}
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import}]
          readinessProbe: {httpGet: {path: /health/ready, port: 9000}, periodSeconds: 5, failureThreshold: 60}
      volumes: [{name: realm, configMap: {name: keycloak-realm}}]
---
apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec:
  type: NodePort
  selector: {app: keycloak}
  ports: [{port: 8080, nodePort: 30081}]
