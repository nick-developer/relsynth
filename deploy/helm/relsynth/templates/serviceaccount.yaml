{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "relsynth.sa" . }}
  labels: {{- include "relsynth.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.serviceAccount.create }}
---
# ServiceAccount of the migrate job: a hook created before it (weight -5), so
# it exists at pre-install; same annotations (workload identity) as the main one
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "relsynth.migrateSa" . }}
  labels: {{- include "relsynth.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
