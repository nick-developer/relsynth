apiVersion: v1
kind: Pod
metadata:
  name: {{ include "relsynth.fullname" . }}-test-ready
  labels: {{- include "relsynth.labels" . | nindent 4 }}
  annotations: {"helm.sh/hook": test, "helm.sh/hook-delete-policy": before-hook-creation}
spec:
  restartPolicy: Never
  securityContext: {{- include "relsynth.podSecurity" . | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "relsynth.image" . }}
      command: [python, -c, "import urllib.request,sys; r=urllib.request.urlopen('http://{{ include "relsynth.fullname" . }}:{{ .Values.service.port }}/readyz', timeout=10); sys.exit(0 if r.status==200 else 1)"]
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
