  expr: days(stay_id.intime) < days(storetime)
- table: outputevents
  type: check
  expr: days(storetime) < days(stay_id.outtime)
- table: pharmacy
  type: check
  expr: days(entertime) <= days(verifiedtime)
- table: poe
  type: check
  expr: days(hadm_id.edregtime) < days(ordertime)
- table: procedureevents
  type: check
  expr: days(starttime) < days(endtime)
- table: procedureevents
  type: check
  expr: days(starttime) < days(stay_id.outtime)
- table: procedures_icd
  type: check
  expr: days(chartdate) < days(hadm_id.deathtime)
- table: services
  type: check
  expr: days(transfertime) < days(hadm_id.dischtime)
- table: services
  type: check
  expr: days(hadm_id.edregtime) < days(transfertime)
- table: transfers
  type: check
  expr: days(intime) < days(outtime)
- table: transfers
  type: check
  expr: days(hadm_id.edregtime) <= days(outtime)
- table: admissions
  type: check
  expr: isnull(deathtime) or hospital_expire_flag == 1
- table: admissions
  type: check
  expr: hospital_expire_flag == 0 or notnull(deathtime)
- table: patients
  type: check
  expr: anchor_age <= 91
- table: microbiologyevents
  type: check
  expr: notnull(chartdate) and (isnull(charttime) or floor(days(charttime)) == floor(days(chartdate)))
- table: diagnoses_icd
  type: check
  expr: seq_num >= 1
- table: icustays
  type: derive
  expr: los = days(outtime) - days(intime)
  tolerance: 0.001
synthesis:
  seed: 7
  scale:
    default: 1.0
