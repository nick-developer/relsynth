        description: the date part of charttime
      charttime:
        type: datetime
        offset_from: chartdate
      spec_itemid:
        type: integer
      spec_type_desc:
        type: categorical
      test_seq:
        type: integer
      storedate:
        type: date
        offset_from: chartdate
      storetime:
        type: datetime
        offset_from: chartdate
      test_itemid:
        type: integer
      test_name:
        type: categorical
      org_itemid:
        type: integer
      org_name:
        type: categorical
      isolate_num:
        type: integer
      quantity:
        type: constant
      ab_itemid:
        type: integer
      ab_name:
        type: categorical
      dilution_text:
        type: categorical
      dilution_comparison:
        type: categorical
      dilution_value:
        type: float
      interpretation:
        type: categorical
        description: S sensitive, R resistant, I intermediate, P pending
      comments:
        type: text
    primary_key: microevent_id
    group_effects:
    - column: spec_itemid
      by:
      - spec_type_desc
      - test_name
    - column: test_seq
      by:
      - chartdate
      - interpretation
    fact:
      anchor: patients
      partner: provider
      time_column: chartdate
      time_bucket: month
  omr:
    role: fact
    columns:
      subject_id:
        type: id
      chartdate:
        type: date
      seq_num:
        type: integer
      result_name:
        type: categorical
      result_value:
        type: text
        text:
          condition_on: result_name
          whole_values: true
    fact:
      anchor: patients
      time_column: chartdate
      time_bucket: month
  outputevents:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: lookup
        lookup: stay_id.hadm_id
      stay_id:
        type: id
      caregiver_id:
        type: id
      charttime:
        type: datetime
      storetime:
        type: datetime
      itemid:
        type: id
      value:
        type: integer
      valueuom:
        type: constant
    fact:
      anchor: patients
      partner: caregiver
      time_column: charttime
      time_bucket: month
  patients:
    role: entity
    columns:
      subject_id:
        type: id
      gender:
        type: categorical
      anchor_age:
        type: integer
        description: age in anchor_year; over 89 is set to 91
      anchor_year:
        type: integer
      anchor_year_group:
        type: categorical
      dod:
        type: date
        description: de-identified date of death, censored one year after the last discharge
    primary_key: subject_id
  pharmacy:
    role: entity
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: lookup
        lookup: poe_id.hadm_id
      pharmacy_id:
        type: id
      poe_id:
        type: id
      starttime:
