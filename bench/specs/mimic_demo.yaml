        - hadm_id
        - stay_id
        - caregiver_id
        - starttime
        - endtime
        - storetime
        - linkorderid
        - ordercategoryname
        - secondaryordercategoryname
        - ordercategorydescription
        - patientweight
        - totalamount
        - statusdescription
  labevents:
