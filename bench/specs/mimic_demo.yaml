# MIMIC-IV Clinical Database Demo 2.2, written from the MIMIC-IV documentation.
# Sources: (read 2026-11-21)
#  - schema overview: https://mimic.mit.edu/docs/IV/about/schema-overview.html
#  - per-table pages: https://mimic.mit.edu/docs/iv/modules (hosp/<table>.html, icu/<table>.html)
# The SQLite build declares no keys, so primary keys, unique keys and links follow the table pages:
# the documented composite links diagnoses_icd / procedures_icd -> d_icd_diagnoses / d_icd_procedures on
# (icd_code, icd_version) cannot be declared (a fact takes no composite link besides its anchor, and a
# referenced table needs a single-column key), so both dictionaries are copied as-is and the codes stay
# modelled columns of the facts; d_icd_procedures, which the draft left out, is added.
# Documented rules (deathtime only for in-hospital deaths, anchor_age capped at 91, chartdate = date of
# charttime, seq_num from 1, los = outtime - intime) and code lists were checked on the demo before they
# were written.  Settings the documentation does not speak to (column types, offsets, date order rules,
# fact roles) are relsynth introspect's draft.
version: 1
name: mimic_demo
source:
  kind: sqlite
  path: bench/.cache/mimic_demo/mimic.db
target:
  kind: csv
  path: synthetic
tables:
  admissions:
    role: entity
    columns:
      subject_id:
        type: id
      hadm_id:
        type: id
      admittime:
        type: datetime
      dischtime:
        type: datetime
        offset_from: admittime
      deathtime:
        type: datetime
        description: present only if the patient died in hospital
      admission_type:
        type: categorical
        description: 9 documented values (AMBULATORY OBSERVATION ... URGENT)
      admit_provider_id:
        type: id
      admission_location:
        type: categorical
      discharge_location:
        type: categorical
      insurance:
        type: categorical
      language:
        type: categorical
      marital_status:
        type: categorical
      race:
        type: categorical
      edregtime:
        type: datetime
      edouttime:
        type: datetime
        offset_from: edregtime
      hospital_expire_flag:
        type: categorical
        description: 1 died in hospital, 0 survived to discharge
    primary_key: hadm_id
  caregiver:
    role: entity
    columns:
      caregiver_id:
        type: id
    primary_key: caregiver_id
  chartevents:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: lookup
        lookup: stay_id.hadm_id
      stay_id:
        type: id
      caregiver_id:
        type: id
      charttime:
        type: datetime
      storetime:
        type: datetime
      itemid:
        type: id
      value:
        type: categorical
      valuenum:
        type: float
      valueuom:
        type: categorical
      warning:
        type: boolean
    fact:
      anchor: icustays
      partner: caregiver
      time_column: charttime
      time_bucket: month
  d_hcpcs:
    role: entity
    columns:
      code:
        type: id
      category:
        type: integer
      long_description:
        type: text
      short_description:
        type: categorical
    primary_key: code
    dimensions:
    - key: short_description
      columns:
      - category
  d_icd_diagnoses:
    role: entity
    columns:
      icd_code:
        type: categorical
      icd_version:
        type: categorical
      long_title:
        type: categorical
    mode: copy
    unique:
    - - icd_code
      - icd_version
  d_items:
    role: entity
    columns:
      itemid:
        type: id
      label:
        type: text
      abbreviation:
        type: text
      linksto:
        type: categorical
      category:
        type: categorical
      unitname:
        type: categorical
      param_type:
        type: categorical
      lownormalvalue:
        type: integer
      highnormalvalue:
        type: float
    primary_key: itemid
  d_labitems:
    role: entity
    columns:
      itemid:
        type: id
      label:
        type: text
      fluid:
        type: categorical
      category:
        type: categorical
    primary_key: itemid
  datetimeevents:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: lookup
        lookup: stay_id.hadm_id
      stay_id:
        type: id
      caregiver_id:
        type: id
      charttime:
        type: datetime
      storetime:
        type: datetime
      itemid:
        type: id
      value:
        type: datetime
      valueuom:
        type: categorical
      warning:
        type: boolean
    fact:
      anchor: patients
      partner: caregiver
      time_column: charttime
      time_bucket: month
  diagnoses_icd:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: id
      seq_num:
        type: sequence
        within: hadm_id
        start: 1
        description: priority of the diagnosis within the admission, from 1
      icd_code:
        type: text
        text:
          condition_on: icd_version
          whole_values: true
      icd_version:
        type: categorical
        description: '9 or 10: the ICD coding system of icd_code'
    unique:
    - - hadm_id
      - seq_num
    fact:
      anchor: admissions
  drgcodes:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: id
      drg_type:
        type: categorical
      drg_code:
        type: integer
      description:
        type: text
      drg_severity:
        type: integer
      drg_mortality:
        type: integer
    unique:
    - - hadm_id
      - drg_type
    fact:
      anchor: patients
      partner: admissions
  emar:
    role: entity
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: id
      emar_id:
        type: id
      emar_seq:
        type: integer
      poe_id:
        type: text
        text:
          condition_on: medication
          whole_values: true
      pharmacy_id:
        type: id
      enter_provider_id:
        type: id
      charttime:
        type: datetime
      medication:
        type: categorical
      event_txt:
        type: categorical
      scheduletime:
        type: datetime
      storetime:
        type: datetime
    primary_key: emar_id
  emar_detail:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: emar_id.subject_id
      emar_id:
        type: id
      emar_seq:
        type: lookup
        lookup: emar_id.emar_seq
      parent_field_ordinal:
        type: float
      administration_type:
        type: categorical
      pharmacy_id:
        type: id
      barcode_type:
        type: categorical
      reason_for_no_barcode:
        type: categorical
      complete_dose_not_given:
        type: boolean
      dose_due:
        type: categorical
      dose_due_unit:
        type: categorical
      dose_given:
        type: float
      dose_given_unit:
        type: categorical
      will_remainder_of_dose_be_given:
        type: boolean
      product_amount_given:
        type: float
      product_unit:
        type: categorical
      product_code:
        type: categorical
      product_description:
        type: categorical
      product_description_other:
        type: categorical
      prior_infusion_rate:
        type: float
      infusion_rate:
        type: float
        ratio_of: prior_infusion_rate
      infusion_rate_adjustment:
        type: categorical
      infusion_rate_adjustment_amount:
        type: integer
      infusion_rate_unit:
        type: categorical
      route:
        type: categorical
      infusion_complete:
        type: boolean
      completion_interval:
        type: categorical
      new_iv_bag_hung:
        type: constant
      continued_infusion_in_other_location:
        type: constant
      restart_interval:
        type: categorical
      side:
        type: categorical
      site:
        type: categorical
      non_formulary_visual_verification:
        type: constant
    group_effects:
    - column: complete_dose_not_given
      by:
      - administration_type
      - emar_id.pharmacy_id
    fact:
      anchor: emar
      partner: pharmacy
  hcpcsevents:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: id
      chartdate:
        type: date
      hcpcs_cd:
        type: id
      seq_num:
        type: integer
      short_description:
        type: lookup
        lookup: hcpcs_cd.short_description
    fact:
      anchor: d_hcpcs
      partner: admissions
      time_column: chartdate
      time_bucket: month
  icustays:
    role: entity
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: id
      stay_id:
        type: id
      first_careunit:
        type: categorical
      last_careunit:
        type: categorical
      intime:
        type: datetime
      outtime:
        type: datetime
        offset_from: intime
      los:
        type: float
        description: length of stay in fractional days (outtime - intime)
    primary_key: stay_id
  ingredientevents:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: lookup
        lookup: stay_id.hadm_id
      stay_id:
        type: id
      caregiver_id:
        type: id
      starttime:
        type: datetime
      endtime:
        type: datetime
        offset_from: starttime
      storetime:
        type: datetime
      itemid:
        type: id
      amount:
        type: float
      amountuom:
        type: lookup
        lookup: itemid.unitname
