          Kcal: Kcal
          grams: grams
          kJ: kJ
          mL: ml
          mg: mg
      rate:
        type: float
      rateuom:
        type: categorical
      orderid:
        type: id
      linkorderid:
        type: integer
      statusdescription:
        type: categorical
      originalamount:
        type: integer
      originalrate:
        type: float
    fact:
      anchor: patients
      partner: d_items
      header:
        key: orderid
        columns:
        - subject_id
        - hadm_id
        - stay_id
        - caregiver_id
        - starttime
        - endtime
        - storetime
        - linkorderid
        - statusdescription
  inputevents:
    role: fact
    columns:
      subject_id:
        type: lookup
        lookup: hadm_id.subject_id
      hadm_id:
        type: lookup
        lookup: stay_id.hadm_id
      stay_id:
        type: id
      caregiver_id:
        type: id
      starttime:
        type: datetime
      endtime:
        type: datetime
        offset_from: starttime
      storetime:
        type: datetime
      itemid:
        type: id
      amount:
        type: float
      amountuom:
        type: categorical
      rate:
        type: float
      rateuom:
        type: categorical
      orderid:
        type: id
      linkorderid:
        type: integer
      ordercategoryname:
        type: categorical
      secondaryordercategoryname:
        type: categorical
      ordercomponenttypedescription:
        type: categorical
      ordercategorydescription:
        type: categorical
      patientweight:
        type: float
      totalamount:
        type: float
      totalamountuom:
        type: constant
      isopenbag:
        type: boolean
      continueinnextdept:
        type: integer
      statusdescription:
        type: categorical
      originalamount:
        type: float
      originalrate:
        type: float
    fact:
