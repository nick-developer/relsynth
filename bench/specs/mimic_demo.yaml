        lookup: pharmacy_id.hadm_id
      pharmacy_id:
        type: id
      poe_id:
        type: lookup
        lookup: pharmacy_id.poe_id
      poe_seq:
        type: lookup
        lookup: poe_id.poe_seq
      order_provider_id:
        type: id
      starttime:
        type: lookup
        lookup: pharmacy_id.starttime
      stoptime:
        type: lookup
        lookup: pharmacy_id.stoptime
      drug_type:
        type: categorical
      drug:
        type: text
