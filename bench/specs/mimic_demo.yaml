  expr: ref_range_lower <= ref_range_upper
- table: microbiologyevents
  type: check
  expr: days(chartdate) <= days(charttime)
- table: microbiologyevents
  type: check
  expr: days(chartdate) < days(storetime)
- table: microbiologyevents
  type: check
  expr: days(charttime) < days(storetime)
- table: microbiologyevents
  type: check
  expr: days(chartdate) <= days(subject_id.dod)
- table: omr
  type: check
