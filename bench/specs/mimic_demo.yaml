    columns:
      labevent_id:
        type: id
      subject_id:
        type: id
      hadm_id:
        type: id
      specimen_id:
        type: id
      itemid:
        type: id
      order_provider_id:
        type: id
      charttime:
        type: datetime
      storetime:
