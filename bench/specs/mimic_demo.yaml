  expr: days(storetime) < days(stay_id.outtime)
- table: datetimeevents
  type: check
  expr: days(value) < days(stay_id.outtime)
- table: emar
  type: check
  expr: days(charttime) <= days(hadm_id.deathtime)
- table: emar
  type: check
  expr: days(hadm_id.edregtime) < days(charttime)
- table: emar
  type: check
  expr: days(scheduletime) <= days(hadm_id.deathtime)
- table: emar
  type: check
  expr: days(hadm_id.edregtime) < days(scheduletime)
- table: emar
  type: check
  expr: days(hadm_id.edregtime) < days(storetime)
- table: icustays
  type: check
  expr: days(intime) < days(outtime)
- table: icustays
  type: check
  expr: days(intime) < days(hadm_id.dischtime)
- table: icustays
  type: check
  expr: days(hadm_id.edregtime) < days(intime)
- table: icustays
  type: check
  expr: days(hadm_id.admittime) < days(outtime)
- table: icustays
  type: check
  expr: days(hadm_id.edregtime) < days(outtime)
- table: icustays
  type: check
  expr: days(hadm_id.edouttime) < days(outtime)
- table: ingredientevents
