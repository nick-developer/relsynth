  expr: days(starttime) < days(endtime)
- table: ingredientevents
  type: check
  expr: days(starttime) < days(stay_id.outtime)
- table: ingredientevents
  type: check
  expr: days(endtime) < days(stay_id.outtime)
- table: ingredientevents
  type: check
  expr: days(stay_id.intime) <= days(storetime)
- table: ingredientevents
  type: check
  expr: days(storetime) < days(stay_id.outtime)
- table: inputevents
  type: check
  expr: days(starttime) < days(endtime)
- table: inputevents
  type: check
  expr: days(starttime) < days(stay_id.outtime)
- table: inputevents
