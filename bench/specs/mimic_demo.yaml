      form_val_disp:
        type: text
        text:
          condition_on: drug_type
          whole_values: true
      form_unit_disp:
        type: categorical
      doses_per_24_hrs:
        type: lookup
        lookup: pharmacy_id.doses_per_24_hrs
      route:
        type: lookup
        lookup: pharmacy_id.route
    fact:
      anchor: pharmacy
