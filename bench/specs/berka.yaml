# Berka / PKDD'99 Discovery Challenge financial data (Czech bank, 1993-1998), as published in the
# SDV public demo copy of the CTU "Financial" database (bench/datasets.py). Tables, keys and the
# meaning of the codes follow the PKDD'99 data description (berka.htm) and the SDV metadata.json.
# berka.htm could not be re-read on 2026-11-27 (lisp.vse.cz and its mirror were unreachable); the
# code meanings in these comments come from that description and are unchecked here, but every
# key and rule below was checked on the full source data.
# Keys: one disposition per client and at most one per account and type (one OWNER, at most one
# DISPONENT); one card per disposition; one loan per account (each holds on every source row).
# loan: amount = duration x payments; duration is 12, 24, 36, 48 or 60 months; status A/B are
# finished contracts (A paid, B not paid), C/D running (C on time, D in debt).
# Not written as rules: trans.balance is the balance after each transaction, but the source does
# not record the order of transactions within a day (trans_id order gives the running balance on
# 49 % of rows), so no cumulative rule is declared.
version: 1
name: berka
source:
  kind: sqlite
  path: bench/.cache/berka/berka.db
target:
  kind: csv
  path: synthetic
tables:
  account:
    role: entity
    columns:
      account_id:
        type: id
      district_id:
        type: id
      frequency:
        type: categorical
      date:
        type: date
    primary_key: account_id
  card:
    role: entity
    columns:
      card_id:
        type: id
      disp_id:
        type: id
      type:
        type: categorical
      issued:
        type: date
    primary_key: card_id
    unique:
    - [disp_id]
  client:
    role: entity
    columns:
      client_id:
        type: id
      gender:
        type: categorical
      birth_date:
        type: date
      district_id:
        type: id
    primary_key: client_id
  disp:
    role: entity
    columns:
      disp_id:
        type: id
      client_id:
        type: id
      account_id:
        type: id
      type:
        type: categorical
    primary_key: disp_id
    unique:
    - [client_id]
    - [account_id, type]
    link_affinity:
    - match:
      - client_id.district_id
      - account_id.district_id
  district:
    role: entity
    columns:
      district_id:
        type: id
      A2:
        type: categorical
      A3:
        type: categorical
      A4:
        type: integer
      A5:
        type: integer
      A6:
        type: integer
      A7:
        type: integer
      A8:
        type: integer
      A9:
        type: integer
      A10:
        type: float
      A11:
        type: integer
      A12:
        type: float
      A13:
        type: float
      A14:
        type: integer
      A15:
        type: integer
      A16:
        type: integer
    primary_key: district_id
    mode: copy
  loan:
    role: entity
    columns:
      loan_id:
        type: id
      account_id:
        type: id
      date:
        type: date
      amount:
        type: integer
      duration:
        type: integer
      payments:
        type: integer
      status:
        type: categorical
    primary_key: loan_id
    unique:
    - [account_id]
  order:
    role: entity
    columns:
      order_id:
        type: id
      account_id:
        type: id
      bank_to:
        type: categorical
      account_to:
        type: integer
      amount:
        type: float
      k_symbol:
        type: categorical
    primary_key: order_id
  trans:
    role: fact
    columns:
      trans_id:
        type: id
      account_id:
        type: id
      date:
        type: date
      type:
        type: categorical
      operation:
        type: categorical
      amount:
        type: integer
      balance:
        type: integer
      k_symbol:
        type: categorical
      bank:
        type: categorical
      account:
        type: integer
    primary_key: trans_id
    fact:
      anchor: account
      time_column: date
      time_bucket: month
relationships:
- child: account
  child_key: district_id
  parent: district
  parent_key: district_id
- child: card
  child_key: disp_id
  parent: disp
  parent_key: disp_id
- child: client
  child_key: district_id
  parent: district
  parent_key: district_id
- child: disp
  child_key: client_id
  parent: client
  parent_key: client_id
- child: disp
  child_key: account_id
  parent: account
  parent_key: account_id
- child: loan
  child_key: account_id
  parent: account
  parent_key: account_id
- child: order
  child_key: account_id
  parent: account
  parent_key: account_id
- child: trans
  child_key: account_id
  parent: account
  parent_key: account_id
rules:
- table: loan
  type: derive
  expr: amount = duration * payments
- table: account
  type: aggregate
  column: date
  agg: min
  from: trans
  of: date
- table: loan
  type: check
  expr: days(account_id.date) < days(date)
- table: trans
  type: check
  expr: days(account_id.date) <= days(date)
# Checks below hold on every source row (card 892, trans 1,056,320, order 6,471).
# Only the owner of an account can be issued a card, and a card is issued after the account opens.
- table: card
  type: check
  expr: disp_id.type == 'OWNER'
- table: card
  type: check
  expr: days(disp_id.account_id.date) <= days(issued)
# A transaction's operation follows its type: PRIJEM (credit) is a cash deposit (VKLAD), a
# collection from another bank (PREVOD Z UCTU) or interest (no operation, k_symbol UROK); VYDAJ
# (withdrawal) is a cash withdrawal (VYBER), a remittance (PREVOD NA UCET) or a card withdrawal
# (VYBER KARTOU). The source also holds 16,666 rows of type VYBER, all with operation VYBER.
- table: trans
  type: check
  expr: isnull(operation) == (k_symbol == 'UROK')
- table: trans
  type: check
  expr: "(type == 'PRIJEM' and (isnull(operation) or operation in ('PREVOD Z UCTU', 'VKLAD'))) or (type == 'VYDAJ'
    and operation in ('PREVOD NA UCET', 'VYBER', 'VYBER KARTOU')) or (type == 'VYBER' and operation == 'VYBER')"
# Pension (DUCHOD) and interest (UROK) are credits; insurance (POJISTNE), sanction interest
# (SANKC. UROK), household (SIPO), statement (SLUZBY) and loan payments (UVER) are withdrawals.
- table: trans
  type: check
  expr: type == 'PRIJEM' or isnull(k_symbol) or k_symbol not in ('DUCHOD', 'UROK')
- table: trans
  type: check
  expr: type == 'VYDAJ' or isnull(k_symbol) or k_symbol not in ('POJISTNE', 'SANKC. UROK', 'SIPO', 'SLUZBY', 'UVER')
- table: trans
  type: check
  expr: amount >= 0
- table: order
  type: check
  expr: amount > 0
synthesis:
  seed: 7
  scale:
    default: 1.0
