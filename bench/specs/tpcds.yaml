      wp_link_count:
        type: integer
      wp_image_count:
        type: integer
      wp_max_ad_count:
        type: integer
    primary_key: wp_web_page_sk
    scd:
      type: 2
      natural_key: wp_web_page_id
      valid_from: wp_rec_start_date
      valid_to: wp_rec_end_date
