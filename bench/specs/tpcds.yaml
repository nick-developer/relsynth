- table: customer
  type: check
  expr: between(c_first_shipto_date_sk - c_first_sales_date_sk, 1, 60)
- table: promotion
  type: check
  expr: between(p_end_date_sk - p_start_date_sk, 1, 70)
- table: catalog_page
