- table: web_returns
  type: check
  expr: wr_return_tax <= wr_return_amt
- table: web_returns
  type: check
  expr: wr_refunded_cash <= wr_return_amt and wr_reversed_charge <= wr_return_amt
- table: web_returns
  type: check
  expr: wr_return_tax < wr_net_loss and wr_fee <= wr_net_loss and wr_return_ship_cost < wr_net_loss
- table: web_returns
  type: derive
  expr: wr_returning_customer_sk = wr_refunded_customer_sk
- table: web_returns
  type: derive
