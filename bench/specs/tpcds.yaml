    primary_key: cp_catalog_page_sk
  web_page:
    role: entity
    description: web pages (clause 2.4.5), SCD2; some pages belong to a customer (wp_customer_sk), so the table
      is synthesised rather than copied
    columns:
      wp_web_page_sk:
        type: id
      wp_web_page_id:
        type: id
        description: business key (B), clause 2.2.1.3
        nullable: false
      wp_rec_start_date:
