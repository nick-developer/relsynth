rules:
- table: store_sales
  type: derive
  expr: ss_ext_sales_price = ss_quantity * ss_sales_price
  tolerance: 0.01
- table: store_sales
  type: derive
  expr: ss_ext_list_price = ss_quantity * ss_list_price
  tolerance: 0.01
- table: store_sales
  type: derive
  expr: ss_ext_wholesale_cost = ss_quantity * ss_wholesale_cost
  tolerance: 0.01
- table: store_sales
  type: derive
  expr: ss_ext_discount_amt = ss_coupon_amt
  tolerance: 0.01
- table: store_sales
  type: derive
  expr: ss_net_paid = ss_ext_sales_price - ss_coupon_amt
  tolerance: 0.01
- table: store_sales
  type: derive
  expr: ss_net_paid_inc_tax = ss_net_paid + ss_ext_tax
  tolerance: 0.01
- table: store_sales
  type: derive
  expr: ss_net_profit = ss_net_paid - ss_ext_wholesale_cost
  tolerance: 0.01
- table: store_sales
  type: check
  expr: ss_sales_price <= ss_list_price
- table: store_sales
  type: check
  expr: ss_wholesale_cost <= ss_list_price and ss_list_price <= 2 * ss_wholesale_cost
- table: store_sales
  type: check
  expr: ss_coupon_amt <= ss_ext_sales_price
- table: store_sales
  type: check
  expr: ss_ext_tax <= ss_net_paid
- table: catalog_sales
  type: derive
  expr: cs_ext_sales_price = cs_quantity * cs_sales_price
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_ext_list_price = cs_quantity * cs_list_price
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_ext_wholesale_cost = cs_quantity * cs_wholesale_cost
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_ext_discount_amt = cs_ext_list_price - cs_ext_sales_price
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_net_paid = cs_ext_sales_price - cs_coupon_amt
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_net_paid_inc_tax = cs_net_paid + cs_ext_tax
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_net_paid_inc_ship = cs_net_paid + cs_ext_ship_cost
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_net_paid_inc_ship_tax = cs_net_paid_inc_ship + cs_ext_tax
  tolerance: 0.01
- table: catalog_sales
  type: derive
  expr: cs_net_profit = cs_net_paid - cs_ext_wholesale_cost
  tolerance: 0.01
- table: catalog_sales
  type: check
  expr: cs_sales_price <= cs_list_price
- table: catalog_sales
  type: check
  expr: cs_wholesale_cost <= cs_list_price and cs_list_price <= 2 * cs_wholesale_cost
- table: catalog_sales
  type: check
  expr: cs_coupon_amt <= cs_ext_sales_price
- table: catalog_sales
  type: check
  expr: cs_ext_tax <= cs_net_paid
- table: web_sales
  type: derive
  expr: ws_ext_sales_price = ws_quantity * ws_sales_price
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_ext_list_price = ws_quantity * ws_list_price
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_ext_wholesale_cost = ws_quantity * ws_wholesale_cost
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_ext_discount_amt = ws_ext_list_price - ws_ext_sales_price
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_net_paid = ws_ext_sales_price - ws_coupon_amt
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_net_paid_inc_tax = ws_net_paid + ws_ext_tax
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_net_paid_inc_ship = ws_net_paid + ws_ext_ship_cost
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_net_paid_inc_ship_tax = ws_net_paid_inc_ship + ws_ext_tax
  tolerance: 0.01
- table: web_sales
  type: derive
  expr: ws_net_profit = ws_net_paid - ws_ext_wholesale_cost
  tolerance: 0.01
- table: web_sales
  type: check
  expr: ws_sales_price <= ws_list_price
- table: web_sales
  type: check
  expr: ws_wholesale_cost <= ws_list_price and ws_list_price <= 2 * ws_wholesale_cost
- table: web_sales
  type: check
  expr: ws_coupon_amt <= ws_ext_sales_price
- table: web_sales
  type: check
  expr: ws_ext_tax <= ws_net_paid
- table: catalog_sales
  type: check
  expr: between(cs_ship_date_sk - cs_sold_date_sk, 2, 90)
- table: web_sales
  type: check
  expr: between(ws_ship_date_sk - ws_sold_date_sk, 1, 120)
- table: store_returns
  type: derive
  expr: sr_return_amt_inc_tax = sr_return_amt + sr_return_tax
  tolerance: 0.01
- table: store_returns
  type: derive
  expr: sr_store_credit = sr_return_amt - sr_refunded_cash - sr_reversed_charge
  tolerance: 0.01
- table: store_returns
  type: check
  expr: sr_return_tax <= sr_return_amt
- table: store_returns
  type: check
  expr: sr_refunded_cash <= sr_return_amt and sr_reversed_charge <= sr_return_amt
- table: store_returns
  type: check
  expr: sr_return_tax < sr_net_loss and sr_fee <= sr_net_loss and sr_return_ship_cost < sr_net_loss
- table: catalog_returns
  type: derive
  expr: cr_return_amt_inc_tax = cr_return_amount + cr_return_tax
  tolerance: 0.01
- table: catalog_returns
  type: derive
  expr: cr_store_credit = cr_return_amount - cr_refunded_cash - cr_reversed_charge
  tolerance: 0.01
- table: catalog_returns
  type: check
  expr: cr_return_tax <= cr_return_amount
- table: catalog_returns
  type: check
  expr: cr_refunded_cash <= cr_return_amount and cr_reversed_charge <= cr_return_amount
- table: catalog_returns
  type: check
  expr: cr_return_tax < cr_net_loss and cr_fee <= cr_net_loss and cr_return_ship_cost < cr_net_loss
- table: web_returns
