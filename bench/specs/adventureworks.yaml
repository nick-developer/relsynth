rules:
- table: DimProduct
  type: derive
  expr: DealerPrice = 0.6 * ListPrice
  tolerance: 0.0001
- table: DimProduct
  type: derive
  expr: ReorderPoint = 0.75 * SafetyStockLevel
- table: DimReseller
  type: derive
  expr: AnnualRevenue = 0.1 * AnnualSales
- table: FactInternetSales
  type: derive
  expr: Freight = 0.025 * ExtendedAmount
  tolerance: 0.0001
- table: FactInternetSales
  type: derive
  expr: TaxAmt = 0.08 * ExtendedAmount
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: TotalProductCost = OrderQuantity * ProductStandardCost
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: ExtendedAmount = OrderQuantity * UnitPrice
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: DiscountAmount = ExtendedAmount * UnitPriceDiscountPct
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: SalesAmount = ExtendedAmount - DiscountAmount
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: Freight = 0.025 * SalesAmount
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: TaxAmt = 0.08 * SalesAmount
  tolerance: 0.0001
- table: FactProductInventory
  type: cumulative
  column: UnitsBalance
  by: ProductKey
  order: DateKey
  step: UnitsIn - UnitsOut
- table: DimCustomer
  type: aggregate
  column: DateFirstPurchase
  agg: min
  from: FactInternetSales
  of: OrderDate
- table: DimProduct
  type: check
  expr: DaysToManufacture < Weight
- table: DimReseller
  type: check
  expr: FirstOrderYear <= LastOrderYear
- table: FactCallCenter
  type: check
  expr: Orders < Calls
- table: FactInternetSales
  type: check
  expr: OrderDateKey.DayNumberOfWeek == ShipDateKey.DayNumberOfWeek
- table: FactResellerSales
  type: check
  expr: OrderDateKey.DayNumberOfWeek == ShipDateKey.DayNumberOfWeek
- table: FactResellerSales
  type: check
  expr: DueDateKey.EnglishMonthName == ShipDateKey.EnglishMonthName
