# AdventureWorksDW (Microsoft sample data warehouse, AdventureWorksDW2019 schema).
# Sources: the DDL script instawdbdw.sql from github.com/microsoft/sql-server-samples (tables, keys
# and the 44 foreign keys, all present below) and the AdventureWorks sample database pages on
# learn.microsoft.com. Three relationships the DDL does not declare are kept because every source
# row satisfies them: FactSurveyResponse.ProductCategoryKey, FactSurveyResponse.ProductSubcategoryKey
# and NewFactCurrencyRate.CurrencyKey.
# The derive rules (DealerPrice = 0.6 x ListPrice, Freight = 2.5 % and TaxAmt = 8 % of the amount,
# reseller line arithmetic) are the sample's generation rules and hold on every source row; the
# sale's territory is the customer's or reseller's (lookup through GeographyKey, every row).
# DimProduct DaysToManufacture < Weight was dropped: Weight is null on 324 of 606 products and the
# rule is not documented. DimProduct keeps empirical-Bayes shrinkage (synthesis.per_table).
version: 1
name: adventureworks
source:
  kind: sqlite
  path: bench/.cache/adventureworks/AdventureWorksDW.db
target:
  kind: csv
  path: synthetic
