rules:
- table: DimProduct
  type: derive
  expr: DealerPrice = 0.6 * ListPrice
  tolerance: 0.0001
- table: DimProduct
  type: derive
  expr: ReorderPoint = 0.75 * SafetyStockLevel
- table: DimReseller
  type: derive
  expr: AnnualRevenue = 0.1 * AnnualSales
- table: FactInternetSales
  type: derive
  expr: Freight = 0.025 * ExtendedAmount
  tolerance: 0.0001
- table: FactInternetSales
  type: derive
  expr: TaxAmt = 0.08 * ExtendedAmount
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: TotalProductCost = OrderQuantity * ProductStandardCost
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: ExtendedAmount = OrderQuantity * UnitPrice
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: DiscountAmount = ExtendedAmount * UnitPriceDiscountPct
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: SalesAmount = ExtendedAmount - DiscountAmount
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: Freight = 0.025 * SalesAmount
  tolerance: 0.0001
- table: FactResellerSales
  type: derive
  expr: TaxAmt = 0.08 * SalesAmount
  tolerance: 0.0001
- table: FactProductInventory
  type: cumulative
  column: UnitsBalance
  by: ProductKey
  order: DateKey
  step: UnitsIn - UnitsOut
- table: DimCustomer
  type: aggregate
  column: DateFirstPurchase
  agg: min
  from: FactInternetSales
  of: OrderDate
# Checks verified on every source row (DimReseller 635, FactCallCenter 120, FactResellerSales 60,855).
# Ship and due dates follow the order date by modelled gaps (offset_from above: 7 and 12 days on
# FactInternetSales; 7/12 days and 9 rows at 8/13 days on FactResellerSales), so the drafted
# day-of-week checks are dropped: the reseller one is broken by those 9 source rows.
- table: DimReseller
  type: check
  expr: FirstOrderYear <= LastOrderYear
- table: FactCallCenter
  type: check
  expr: Orders < Calls
- table: FactResellerSales
  type: check
  expr: DueDateKey.EnglishMonthName == ShipDateKey.EnglishMonthName
synthesis:
  seed: 7
  scale:
    default: 1.0
  # DimProduct (606 rows in 24 segments of 6-49 rows) sits near the distance limit at
  # the 2.1 fit; its segment marginals are shrunk by the empirical-Bayes prior
  # (docs/privacy.md, Small dimensions).  The other tables keep the default (off).
  per_table:
    DimProduct:
      marginals:
        segment_prior_rows: auto
