# UCI / KDD Forest CoverType, written from its documentation.
# Sources:
#  - https://kdd.ics.uci.edu/databases/covertype/covertype.data.html (attributes, units, the hillshade
#    index 0 to 255, the 4 wilderness-area and 40 soil-type binary columns, the 7 cover types)
#  - https://archive.ics.uci.edu/dataset/31/covertype (no missing values)
# "12 measures, but 54 columns": wilderness area and soil type are one measure each, coded as binary
# columns, so exactly one column of each group is set (true on every one of the 581,012 rows).
# label is Cover_Type. The rule between the hydrology distances is relsynth introspect's draft, kept
# where the documentation does not speak; so are the column types it agrees with.
version: 1
name: covtype
source:
  kind: sqlite
  path: bench/.cache/covtype/covtype.db
target:
  kind: csv
  path: synthetic
tables:
  covtype:
    role: entity
    columns:
      row_id:
        type: id
        description: row number added by the bench builder (not in the release)
      Elevation:
        type: integer
        description: meters
      Aspect:
        type: integer
        min: 0
        max: 360
        description: aspect in degrees azimuth
      Slope:
        type: integer
        min: 0
        description: slope in degrees
      Horizontal_Distance_To_Hydrology:
        type: integer
        description: meters
      Vertical_Distance_To_Hydrology:
        type: integer
        description: meters
      Horizontal_Distance_To_Roadways:
        type: integer
        description: meters
      Hillshade_9am:
        type: integer
        min: 0
        max: 255
        description: hillshade index, 0 to 255
      Hillshade_Noon:
        type: integer
        min: 0
        max: 255
        description: hillshade index, 0 to 255
      Hillshade_3pm:
        type: integer
        min: 0
        max: 255
        description: hillshade index, 0 to 255
      Horizontal_Distance_To_Fire_Points:
        type: integer
        description: meters
      Wilderness_Area_0:
        type: boolean
        description: 'wilderness area designation, 0 absence or 1 presence (one of 4: Rawah, Neota, Comanche Peak,
          Cache la Poudre)'
      Wilderness_Area_1:
        type: boolean
        description: 'wilderness area designation, 0 absence or 1 presence (one of 4: Rawah, Neota, Comanche Peak,
          Cache la Poudre)'
      Wilderness_Area_2:
        type: boolean
        description: 'wilderness area designation, 0 absence or 1 presence (one of 4: Rawah, Neota, Comanche Peak,
          Cache la Poudre)'
      Wilderness_Area_3:
