# Contoso Data Generator V2 (SQLBI), ready-to-use 100k-orders Parquet set, written from its documentation.
# Sources:
#  - https://github.com/sql-bi/Contoso-Data-Generator-V2 at eaeb57a9: scripts/sql/CreateTablesCommon.sql,
#    CreateTablesOrders.sql, CreateTablesSales.sql (tables, columns, types, primary keys; Sales is the
#    join of Orders and OrderRows), README.md and docs/imgs/schema_*.svg (the two schemas)
#  - https://docs.sqlbi.com/contoso-data-generator/ (details, config-json, config-data): customers are
#    active between StartDT and EndDT; a store is active only between its open and close dates; each order
#    goes to the online store (StoreKey 999999 in this set) or to a local store of the customer's country;
#    the currency follows the customer's country (CountryCurrency); the delivery date is the order date
#    plus one day plus a random number of days; quantities start at 1 and discounts are whole percentages
#    from 0 % (OrderQuantityWeights, DiscountWeights)
# Every rule below was checked on the set (93,470 orders, 223,974 rows): 0 violations except the age
# derive, which holds on 99.38 % of customers (ages are computed at the generator's run date).
# Model settings no page speaks to (fact anchor, group effect on prices, link affinity of customer and
# store areas) are relsynth's usual choices, kept from the reviewed draft.
version: 1
name: contoso_parquet
source:
  kind: parquet
  path: bench/.cache/contoso/parquet
target:
  kind: csv
  path: synthetic
tables:
  currencyexchange:
    role: entity
    columns:
      Date:
        type: date
      FromCurrency:
        type: categorical
      ToCurrency:
        type: categorical
      Exchange:
        type: float
    mode: copy
    unique:
    - - Date
      - FromCurrency
      - ToCurrency
  customer:
    role: entity
    columns:
      CustomerKey:
        type: id
      GeoAreaKey:
        type: integer
      StartDT:
        type: date
      EndDT:
        type: date
      Continent:
        type: categorical
      Gender:
        type: categorical
      Title:
        type: categorical
      GivenName:
        type: pii
        pii:
          generator: person_name
      MiddleInitial:
        type: categorical
      Surname:
        type: pii
        pii:
          generator: person_name
      StreetAddress:
        type: pii
        pii:
          generator: pattern
      City:
        type: text
        text:
          condition_on: StateFull
          whole_values: true
      State:
        type: categorical
      StateFull:
        type: categorical
      ZipCode:
        type: pii
        pii:
          generator: pattern
      Country:
        type: categorical
      CountryFull:
        type: categorical
      Birthday:
        type: date
      Age:
        type: integer
      Occupation:
        type: categorical
      Company:
        type: categorical
      Vehicle:
        type: text
      Latitude:
        type: float
      Longitude:
        type: float
    primary_key: CustomerKey
    dimensions:
    - key: StateFull
      columns:
      - GeoAreaKey
      - Continent
      - State
      - Country
      - CountryFull
      anchor: Country
  date:
    role: entity
    columns:
      Date:
        type: date
      DateKey:
        type: id
      Year:
        type: integer
      YearQuarter:
        type: categorical
      YearQuarterNumber:
        type: integer
      Quarter:
        type: categorical
      YearMonth:
        type: categorical
      YearMonthShort:
        type: categorical
      YearMonthNumber:
        type: integer
      Month:
        type: categorical
      MonthShort:
        type: categorical
      MonthNumber:
        type: integer
      DayofWeek:
        type: categorical
      DayofWeekShort:
        type: categorical
      DayofWeekNumber:
        type: integer
      WorkingDay:
        type: boolean
      WorkingDayNumber:
        type: integer
    primary_key: DateKey
    mode: copy
  orderrows:
    role: fact
    columns:
      OrderKey:
        type: id
      RowNumber:
        type: sequence
        within: OrderKey
        start: 0
      ProductKey:
        type: id
      Quantity:
        type: integer
        min: 1
      UnitPrice:
        type: float
        ratio_of: ProductKey.Price
      NetPrice:
        type: float
        ratio_of: UnitPrice
        description: UnitPrice less a whole-percent discount (0 % to 14 % in this set)
      UnitCost:
        type: float
        ratio_of: ProductKey.Cost
        ratio_same_as: UnitPrice
    unique:
    - - OrderKey
      - RowNumber
    group_effects:
    - column: UnitPrice
      by:
      - OrderKey.DT
      - ProductKey.CategoryKey
    fact:
      anchor: orders
      partner: product
  orders:
    role: entity
    columns:
      OrderKey:
        type: id
      CustomerKey:
        type: id
      StoreKey:
        type: id
      DT:
        type: date
      DeliveryDate:
        type: date
        offset_from: DT
      CurrencyCode:
        type: lookup
        lookup: CustomerKey.Country
        map:
          AU: AUD
          CA: CAD
          DE: EUR
          FR: EUR
          GB: GBP
          IT: EUR
          NL: EUR
          US: USD
    primary_key: OrderKey
    link_affinity:
    - match:
      - CustomerKey.GeoAreaKey
      - StoreKey.GeoAreaKey
    key_order: DT
  product:
    role: entity
    columns:
      ProductKey:
        type: id
      ProductCode:
        type: id
      ProductName:
        type: text
      Manufacturer:
        type: categorical
      Brand:
        type: categorical
      Color:
        type: categorical
      WeightUnit:
        type: categorical
      Weight:
        type: float
      Cost:
        type: float
      Price:
        type: float
      CategoryKey:
        type: integer
      CategoryName:
        type: categorical
      SubCategoryKey:
        type: integer
      SubCategoryName:
        type: categorical
    primary_key: ProductKey
    dimensions:
    - key: SubCategoryKey
      columns:
      - CategoryKey
      - CategoryName
      - SubCategoryName
      anchor: SubCategoryName
  sales:
    role: view
    columns:
      OrderKey:
        type: id
      LineNumber:
        type: integer
        base_column: RowNumber
      OrderDate:
        type: lookup
        lookup: OrderKey.DT
      DeliveryDate:
        type: lookup
        lookup: OrderKey.DeliveryDate
      CustomerKey:
        type: lookup
        lookup: OrderKey.CustomerKey
      StoreKey:
        type: lookup
        lookup: OrderKey.StoreKey
      ProductKey:
        type: id
      Quantity:
        type: integer
      UnitPrice:
        type: float
      NetPrice:
        type: float
      UnitCost:
        type: float
      CurrencyCode:
        type: lookup
        lookup: OrderKey.CurrencyCode
      ExchangeRate:
        type: lookup
        lookup:
          table: currencyexchange
          match:
            Date: OrderDate
            FromCurrency: '''USD'''
            ToCurrency: CurrencyCode
          value: Exchange
    view_of: orderrows
  store:
    role: entity
    columns:
      StoreKey:
        type: id
      StoreCode:
        type: integer
      GeoAreaKey:
        type: integer
      CountryCode:
        type: categorical
      CountryName:
        type: categorical
      State:
        type: categorical
      OpenDate:
        type: date
      CloseDate:
        type: date
      Description:
        type: categorical
      SquareMeters:
        type: integer
      Status:
        type: categorical
    primary_key: StoreKey
    mode: copy
relationships:
- child: orderrows
  child_key: OrderKey
  parent: orders
- child: orderrows
  child_key: ProductKey
  parent: product
- child: orders
  child_key: CustomerKey
  parent: customer
- child: orders
  child_key: StoreKey
  parent: store
- child: sales
  child_key: OrderKey
  parent: orders
- child: sales
  child_key: CustomerKey
  parent: customer
- child: sales
  child_key: StoreKey
  parent: store
- child: sales
  child_key: ProductKey
  parent: product
rules:
- table: customer
  type: derive
  expr: Age = years_between(Birthday, '2021-02-02')
  holds: 0.9938
  violation: offset
- table: customer
  type: check
  expr: days(StartDT) < days(EndDT)
- table: orders
  type: check
  expr: days(CustomerKey.StartDT) <= days(DT) and days(DT) < days(CustomerKey.EndDT)
- table: orders
  type: check
  expr: days(StoreKey.OpenDate) < days(DT)
- table: orders
  type: check
  expr: days(DT) <= days(StoreKey.CloseDate)
- table: orders
  type: check
  expr: days(DT) == days(DeliveryDate) or StoreKey == 999999
- table: orders
  type: check
  expr: days(DT) != days(DeliveryDate) or StoreKey != 999999
- table: orders
  type: check
  expr: CustomerKey.Country == StoreKey.CountryCode or StoreKey == 999999
- table: orders
  type: check
  expr: CustomerKey.Country != StoreKey.CountryCode or StoreKey != 999999
- table: product
  type: check
  expr: Cost < Price
synthesis:
  seed: 7
  scale:
    default: 1.0
