rules:
- table: claims
  type: derive
  expr: PATIENTDEPARTMENTID = DEPARTMENTID
- table: claims_transactions
  type: derive
  expr: UNITAMOUNT = AMOUNT
  tolerance: 0.01
- table: claims_transactions
  type: derive
  expr: TRANSFERS = AMOUNT
  tolerance: 0.01
- table: claims_transactions
  type: derive
  expr: OUTSTANDING = AMOUNT
  tolerance: 0.01
- table: medications
  type: derive
  expr: TOTALCOST = BASE_COST * DISPENSES
  tolerance: 0.01
- table: claims
  type: aggregate
  column: PATIENTDEPARTMENTID
  agg: min
  from: claims_transactions
  of: DEPARTMENTID
- table: organizations
  type: aggregate
  column: UTILIZATION
  agg: sum
  from: providers
  of: UTILIZATION
- table: allergies
  type: check
  expr: days(START) < days(ENCOUNTER.START)
- table: allergies
  type: check
  expr: days(START) < days(ENCOUNTER.STOP)
- table: careplans
  type: check
  expr: days(START) <= days(STOP)
- table: claims
  type: check
  expr: days(CURRENTILLNESSDATE) <= days(LASTBILLEDDATEP)
- table: claims
  type: check
  expr: days(CURRENTILLNESSDATE) <= days(APPOINTMENTID.START)
- table: claims
  type: check
  expr: days(CURRENTILLNESSDATE) < days(APPOINTMENTID.STOP)
- table: claims
  type: check
  expr: days(APPOINTMENTID.START) <= days(LASTBILLEDDATEP)
- table: claims
  type: check
  expr: days(LASTBILLEDDATEP) <= days(APPOINTMENTID.STOP)
- table: claims_transactions
  type: check
  expr: TRANSFEROUTID < CHARGEID
- table: conditions
  type: check
  expr: days(START) <= days(STOP)
- table: encounters
  type: check
  expr: days(START) < days(STOP)
- table: encounters
  type: check
  expr: PAYER_COVERAGE <= TOTAL_CLAIM_COST
- table: encounters
  type: check
  expr: days(PATIENT.BIRTHDATE) < days(START)
- table: encounters
  type: check
  expr: days(PATIENT.BIRTHDATE) < days(STOP)
- table: imaging_studies
  type: check
  expr: days(ENCOUNTER.START) <= days(DATE)
- table: imaging_studies
  type: check
  expr: days(DATE) < days(ENCOUNTER.STOP)
- table: medications
  type: check
  expr: days(START) <= days(STOP)
- table: medications
  type: check
  expr: PAYER_COVERAGE < BASE_COST
- table: medications
  type: check
  expr: days(ENCOUNTER.START) <= days(STOP)
- table: observations
  type: check
  expr: days(PATIENT.BIRTHDATE) < days(DATE)
- table: payer_transitions
  type: check
  expr: days(START_YEAR) < days(END_YEAR)
- table: payer_transitions
  type: check
  expr: days(PATIENT.BIRTHDATE) < days(START_YEAR)
- table: payer_transitions
  type: check
  expr: days(START_YEAR) < days(PATIENT.DEATHDATE)
- table: payer_transitions
  type: check
  expr: days(PATIENT.BIRTHDATE) < days(END_YEAR)
- table: procedures
  type: check
  expr: days(START) <= days(STOP)
- table: claims_transactions
  type: check
  expr: notnull(AMOUNT) == (TYPE == 'CHARGE' or TYPE == 'TRANSFERIN')
synthesis:
