# Synthea 1k-patient sample (SDV copy), written from the Synthea CSV data dictionary.
# Sources:
#  - https://github.com/synthetichealth/synthea/wiki/CSV-File-Data-Dictionary (files, columns, primary
#    and foreign keys, code lists, what a cost column includes)
#  - keys and foreign keys of the copy: the SDV metadata the builder declares.
# Each documented rule was checked on the data before it was written. Where the copy differs from the
# dictionary, the data is kept and noted:
#  - claims.PRIMARYPATIENTINSURANCEID is a payer on 78% of rows only, so it is not declared as a link;
#  - claims_transactions.PATIENTINSURANCEID holds patient ids (the dictionary: a payer-transition member
#    id; MEMBERID is empty in the copy), so it links to patients;
#  - claims.REFERRINGPROVIDERID is empty.
# The dictionary states no date order; the date rules, roles and offsets are relsynth introspect's
# draft, kept where the dictionary does not speak.
version: 1
name: synthea_1k
source:
  kind: sqlite
  path: bench/.cache/synthea/synthea.db
target:
  kind: csv
  path: synthetic
tables:
  allergies:
    role: fact
    columns:
      START:
        type: date
      STOP:
        type: constant
      PATIENT:
        type: lookup
        lookup: ENCOUNTER.PATIENT
      ENCOUNTER:
        type: id
      CODE:
        type: integer
      SYSTEM:
        type: constant
      DESCRIPTION:
        type: categorical
      TYPE:
        type: categorical
        description: allergy or intolerance
      CATEGORY:
        type: categorical
        description: drug, medication, food, environment
      REACTION1:
        type: integer
      DESCRIPTION1:
        type: categorical
      SEVERITY1:
        type: categorical
        description: MILD, MODERATE, SEVERE
      REACTION2:
        type: integer
      DESCRIPTION2:
        type: categorical
      SEVERITY2:
        type: categorical
        description: MILD, MODERATE, SEVERE
    unique:
    - - PATIENT
      - DESCRIPTION
    - - ENCOUNTER
      - DESCRIPTION
    fact:
      anchor: encounters
      time_column: START
      time_bucket: month
  careplans:
