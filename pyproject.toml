[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relsynth"
dynamic = ["version"]
description = "Bayesian synthetic data for relational databases: star and snowflake schemas, keys, business rules and privacy, fitted in-database for large tables."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "nick-developer" }]
maintainers = [{ name = "nick-developer" }]
keywords = ["synthetic data", "relational databases", "Bayesian", "privacy", "data warehouse", "test data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "SQLAlchemy>=2.0.25",
    "PyYAML>=6.0",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5.0"]
mssql-pymssql = ["pymssql>=2.2.8"]
oracle = ["oracledb>=2.0"]
mysql = ["pymysql>=1.1.1"]
parquet = ["pyarrow>=14"]
speed = ["numba>=0.59"]
benchmark = ["xgboost>=2.0"]
ir = ["jsonschema>=4.18"]                  # JSON Schema check of IR documents (relsynth ir validate)
all = ["relsynth[postgres,mssql,oracle,mysql,parquet]"]
# the benchmark harness only (unpacks the Contoso release); py7zr is LGPL-2.1+, never a runtime dependency
bench = ["py7zr>=0.21"]
dev = [
    "relsynth[all,ir]",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "mutmut>=3.3",
]

[project.scripts]
relsynth = "relsynth.cli:main"

[project.urls]
Source = "https://github.com/nick-developer/relsynth"
Issues = "https://github.com/nick-developer/relsynth/issues"
Changelog = "https://github.com/nick-developer/relsynth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nick-developer/relsynth/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "relsynth._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relsynth = ["py.typed", "ir/schema/*.json", "quality/schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                # the benchmark harness (bench/) is tested from tests/unit
addopts = "-ra --strict-markers -m 'not science'"
markers = [
    "postgres: needs a live PostgreSQL (RELSYNTH_TEST_PG_URL)",
    "mssql: needs a live SQL Server (RELSYNTH_TEST_MSSQL_URL)",
    "oracle: needs a live Oracle Database (RELSYNTH_TEST_ORACLE_URL)",
    "mysql: needs a live MySQL 8 server (RELSYNTH_TEST_MYSQL_URL)",
    "mariadb: needs a live MariaDB server (RELSYNTH_TEST_MARIADB_URL)",
    "slow: end-to-end runs that take more than a few seconds",
    "science: the statistical check suite C00-C78 (about an hour; run with -m science)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyarrow.*",
]

[tool.coverage.run]
source = ["relsynth"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# relsynth 1.0 has no annotations in most modules; tools/mypy_ratchet.py keeps
# the number of errors from growing (docs/testing.md)

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = [
    "E731",   # lambdas are used as small key functions
    "E741",   # mathematical names (l, I) follow the papers
    "B023",   # loop variables are bound through default arguments where it matters
    "B905",   # zip() without strict= is intended (equal lengths by construction)
    "S101",   # assert is used for internal invariants in the numerical code
    "S311",   # random module is not used for security; numpy Generators are seeded on purpose
    "UP006", "UP007", "UP035",
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# human-readable diagnosis messages and generated reference text
"src/relsynth/doctor.py" = ["E501"]
"src/relsynth/schema.py" = ["E501"]
# fake-data generators (wide literal specs) and the generators of the reference docs
"tests/fakedata/**" = ["S", "B", "E501", "E401"]
"docs/*.py" = ["E501"]
# benchmark builders and domain checks, kept as they were written for layer 2 (bench/README.md);
# their SQL names come from the dataset's own DDL, not from users
"bench/builders/**" = ["E501", "S608", "UP031"]
"bench/checks/**" = ["E501", "S608", "F401", "F841", "E731"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]

[tool.mutmut]
# Mutation testing of the core engine (docs/testing.md, "Mutation testing").
# The whole package is copied; only the five core modules are mutated, and only
# on lines that the fast core tests execute.
source_paths = ["src/relsynth/"]
only_mutate = [
    "src/relsynth/counts.py",
    "src/relsynth/posterior.py",
    "src/relsynth/copula.py",
    "src/relsynth/relational.py",
    "src/relsynth/evaluate.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/core/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
mutate_only_covered_lines = true
