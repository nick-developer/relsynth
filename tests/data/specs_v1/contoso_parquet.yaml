version: 1
name: draft
source:
  kind: csv
  path: ../raw_extract
target:
  kind: csv
  path: synthetic
tables:
  currencyexchange:
    role: entity
    columns:
      Date:
        type: date
      FromCurrency:
        type: categorical
      ToCurrency:
        type: categorical
      Exchange:
        type: float
    mode: copy
    unique:
    - - Date
      - FromCurrency
      - ToCurrency
  customer:
    role: entity
    columns:
      CustomerKey:
        type: id
      GeoAreaKey:
        type: integer
      StartDT:
        type: date
      EndDT:
        type: date
      Continent:
        type: categorical
      Gender:
        type: categorical
      Title:
        type: categorical
      GivenName:
        type: pii
        pii:
          generator: person_name
      MiddleInitial:
        type: categorical
      Surname:
        type: pii
        pii:
          generator: person_name
      StreetAddress:
        type: pii
        pii:
          generator: pattern
      City:
        type: text
        text:
          condition_on: StateFull
          whole_values: true
      State:
        type: categorical
      StateFull:
        type: categorical
      ZipCode:
        type: pii
        pii:
          generator: pattern
      Country:
        type: categorical
      CountryFull:
        type: categorical
      Birthday:
        type: date
      Age:
        type: integer
      Occupation:
        type: categorical
      Company:
        type: categorical
      Vehicle:
        type: text
      Latitude:
        type: float
      Longitude:
        type: float
    primary_key: CustomerKey
    dimensions:
    - key: StateFull
      columns:
      - GeoAreaKey
      - Continent
      - State
      - Country
      - CountryFull
      anchor: Country
  date:
    role: entity
    columns:
      Date:
        type: date
      DateKey:
        type: id
      Year:
        type: integer
      YearQuarter:
        type: categorical
      YearQuarterNumber:
        type: integer
      Quarter:
        type: categorical
      YearMonth:
        type: categorical
      YearMonthShort:
        type: categorical
      YearMonthNumber:
        type: integer
      Month:
        type: categorical
      MonthShort:
        type: categorical
      MonthNumber:
        type: integer
      DayofWeek:
        type: categorical
      DayofWeekShort:
        type: categorical
      DayofWeekNumber:
        type: integer
      WorkingDay:
        type: boolean
      WorkingDayNumber:
        type: integer
    primary_key: DateKey
    mode: copy
  orderrows:
    role: fact
    columns:
      OrderKey:
        type: id
      RowNumber:
        type: sequence
        within: OrderKey
        start: 0
      ProductKey:
        type: id
      Quantity:
        type: integer
      UnitPrice:
        type: float
        ratio_of: ProductKey.Price
      NetPrice:
        type: float
        ratio_of: UnitPrice
      UnitCost:
        type: float
        ratio_of: ProductKey.Cost
        ratio_same_as: UnitPrice
    unique:
    - - OrderKey
      - RowNumber
    fact:
      anchor: orders
      partner: product
  orders:
    role: entity
    columns:
      OrderKey:
        type: id
      CustomerKey:
        type: id
      StoreKey:
        type: id
      DT:
        type: date
      DeliveryDate:
        type: date
        offset_from: DT
      CurrencyCode:
        type: lookup
        lookup: CustomerKey.Country
        map:
          AU: AUD
          CA: CAD
          DE: EUR
          FR: EUR
          GB: GBP
          IT: EUR
          NL: EUR
          US: USD
    primary_key: OrderKey
    key_order: DT
  product:
    role: entity
    columns:
      ProductKey:
        type: id
      ProductCode:
        type: id
      ProductName:
        type: text
      Manufacturer:
        type: categorical
      Brand:
        type: categorical
      Color:
        type: categorical
      WeightUnit:
        type: categorical
      Weight:
        type: float
      Cost:
        type: float
      Price:
        type: float
      CategoryKey:
        type: integer
      CategoryName:
        type: categorical
      SubCategoryKey:
        type: integer
      SubCategoryName:
        type: categorical
    primary_key: ProductKey
    dimensions:
    - key: SubCategoryKey
      columns:
      - CategoryKey
      - CategoryName
      - SubCategoryName
      anchor: SubCategoryName
  sales:
    role: view
    columns:
      OrderKey:
        type: id
      LineNumber:
        type: integer
        base_column: RowNumber
      OrderDate:
        type: lookup
        lookup: OrderKey.DT
      DeliveryDate:
        type: lookup
        lookup: OrderKey.DeliveryDate
      CustomerKey:
        type: lookup
        lookup: OrderKey.CustomerKey
      StoreKey:
        type: lookup
        lookup: OrderKey.StoreKey
      ProductKey:
        type: id
      Quantity:
        type: integer
      UnitPrice:
        type: float
      NetPrice:
        type: float
      UnitCost:
        type: float
      CurrencyCode:
        type: lookup
        lookup: OrderKey.CurrencyCode
      ExchangeRate:
        type: lookup
        lookup:
          table: currencyexchange
          match:
            Date: OrderDate
            FromCurrency: '''USD'''
            ToCurrency: CurrencyCode
          value: Exchange
    view_of: orderrows
  store:
    role: entity
    columns:
      StoreKey:
        type: id
      StoreCode:
        type: integer
      GeoAreaKey:
        type: integer
      CountryCode:
        type: categorical
      CountryName:
        type: categorical
      State:
        type: categorical
      OpenDate:
        type: date
      CloseDate:
        type: date
      Description:
        type: categorical
      SquareMeters:
        type: integer
      Status:
        type: categorical
    primary_key: StoreKey
    mode: copy
relationships:
- child: orderrows
  child_key: OrderKey
  parent: orders
- child: orderrows
  child_key: ProductKey
  parent: product
- child: orders
  child_key: CustomerKey
  parent: customer
- child: orders
  child_key: StoreKey
  parent: store
- child: sales
  child_key: OrderKey
  parent: orders
- child: sales
  child_key: CustomerKey
  parent: customer
- child: sales
  child_key: StoreKey
  parent: store
- child: sales
  child_key: ProductKey
  parent: product
rules:
- table: customer
  type: check
  expr: days(StartDT) < days(EndDT)
- table: orders
  type: check
  expr: days(DT) < days(CustomerKey.EndDT)
- table: orders
  type: check
  expr: days(StoreKey.OpenDate) < days(DT)
- table: orders
  type: check
  expr: days(DT) <= days(StoreKey.CloseDate)
- table: orders
  type: check
  expr: days(DT) == days(DeliveryDate) or StoreKey == 999999
- table: orders
  type: check
  expr: days(DT) != days(DeliveryDate) or StoreKey != 999999
- table: orders
  type: check
  expr: CustomerKey.Country == StoreKey.CountryCode or StoreKey == 999999
- table: orders
  type: check
  expr: CustomerKey.Country != StoreKey.CountryCode or StoreKey != 999999
- table: product
  type: check
  expr: Cost < Price
synthesis:
  seed: 7
  scale:
    default: 1.0
review:
- 'customer: primary key CustomerKey inferred (unique, non-null, key-like name)'
- 'date: primary key DateKey inferred (unique, non-null, key-like name)'
- 'orders: primary key OrderKey inferred (unique, non-null, key-like name)'
- 'product: primary key ProductKey inferred (unique, non-null, key-like name)'
- 'store: primary key StoreKey inferred (unique, non-null, key-like name)'
- 'orderrows.OrderKey -> orders: foreign key inferred (100% of values found in the parent)'
- 'orderrows.ProductKey -> product: foreign key inferred (100% of values found in the parent)'
- 'orders.CustomerKey -> customer: foreign key inferred (100% of values found in the parent)'
- 'orders.StoreKey -> store: foreign key inferred (100% of values found in the parent)'
- 'sales.OrderKey -> orders: foreign key inferred (100% of values found in the parent)'
- 'sales.CustomerKey -> customer: foreign key inferred (100% of values found in the parent)'
- 'sales.StoreKey -> store: foreign key inferred (100% of values found in the parent)'
- 'sales.ProductKey -> product: foreign key inferred (100% of values found in the parent)'
- 'date: calendar (one row per day, 2016-01-01 to 2026-12-31, order column Date); copied as public reference data'
- 'currencyexchange: unique key [''Date'', ''FromCurrency'', ''ToCurrency''] inferred (no repeat in the sample where
  independent columns would repeat at least 10 times)'
- 'customer.GivenName: pii (name matches person_name)'
- 'customer.Surname: pii (name matches person_name)'
- 'customer.StreetAddress: pii (name matches pattern)'
- 'customer.ZipCode: pii (name matches pattern)'
- 'customer.Vehicle: text (long-tail labels (91% of rows hold values seen fewer than 5 times, mean 3.1 words): generated
  as short text; declare pii if they name people)'
- 'date.WorkingDay: boolean (only 0/1 values)'
- 'product.ProductCode: id (numeric codes with leading zeros (100% of values); kept as text)'
- 'product.ProductName: text (free text (mean 6.5 words))'
- 'store.State: categorical (labels of a small reference table)'
- 'store.Description: categorical (labels of a small reference table)'
- 'currencyexchange: reference table (100,450 rows, key [''Date'', ''FromCurrency'', ''ToCurrency'']) that no table
  links to; read by keyed lookups, copied as-is (set mode: synthesize if it holds confidential data)'
- 'store: 74 rows of reference data, copied as-is (set mode: synthesize if it holds confidential data)'
- 'sales.CustomerKey: lookup OrderKey.CustomerKey (equal on 100.0% of 20,000 sampled rows; 0.0% expected by chance)'
- 'sales.DeliveryDate: lookup OrderKey.DeliveryDate (equal on 100.0% of 20,000 sampled rows; 0.0% expected by chance)'
- 'sales.StoreKey: lookup OrderKey.StoreKey (equal on 100.0% of 20,000 sampled rows; 17.9% expected by chance)'
- 'sales.CurrencyCode: lookup OrderKey.CurrencyCode (equal on 100.0% of 20,000 sampled rows; 33.5% expected by chance)'
- 'sales.OrderDate: lookup OrderKey.DT (equal on 100.0% of 20,000 sampled rows; 0.1% expected by chance)'
- 'sales.ExchangeRate: keyed lookup currencyexchange.Exchange at Date = OrderDate, FromCurrency = ''USD'', ToCurrency
  = CurrencyCode (equal on 100.0% of 5,000 sampled rows; 26.4% by chance)'
- 'orders.CurrencyCode: mapped lookup of CustomerKey.Country (8 values; the map holds on 100.0% of 20,000 sampled
  rows, 51.4% by chance)'
- 'orderrows: unique key [''OrderKey'', ''RowNumber''] inferred (RowNumber numbers the rows of each OrderKey without
  repeats in 100.0% of 249 complete groups)'
- 'sales: unique key [''OrderKey'', ''LineNumber''] inferred (LineNumber numbers the rows of each OrderKey without
  repeats in 100.0% of 249 complete groups)'
- 'sales: view of orderrows (the same 6,314 sampled keys [''OrderKey'', ''LineNumber'']; every column is a column
  of orderrows or a lookup, renamed: LineNumber = orderrows.RowNumber); rebuilt from the synthetic orderrows, so
  it equals the join exactly'
- 'orders.DeliveryDate: offset from DT (never earlier; 18 distinct gaps, most common 0 (58%), 3 (11%), 2 (10%));
  generated as DT plus a modelled gap'
- 'orderrows.RowNumber: line number 0..n-1 within OrderKey (starts at 0 in 100.0% of 300 complete groups; 2.7% of
  groups skip numbers, which the synthetic data does not)'
- 'customer: StateFull (554 values) determines GeoAreaKey, Continent, State, Country, CountryFull on at least 99.9%
  of the sampled rows; generated through a copied dimension of their observed combinations, Country modelled with
  the other columns and StateFull drawn within it'
- 'product: SubCategoryKey (32 values) determines CategoryKey, CategoryName, SubCategoryName on at least 99.9% of
  the sampled rows; generated through a copied dimension of their observed combinations, SubCategoryName modelled
  with the other columns and SubCategoryKey drawn within it'
- 'customer.City: 10,480 labels, 90.6% of 11,759 sampled rows with a repeated label sit in the label''s most common
  StateFull (24.2% by chance); generated within StateFull from the labels held by enough rows (text.whole_values)'
- 'orderrows.UnitPrice: ratio of ProductKey.Price: UnitPrice = ProductKey.Price x one of 16 factors (to 2 decimals;
  reproduces 100.0% of rows to the stored precision, 0.6% by chance); the factor is modelled, the value derived'
- 'orderrows.NetPrice: ratio of UnitPrice: NetPrice = UnitPrice x one of 15 factors (to 2 decimals; reproduces 100.0%
  of rows to the stored precision, 0.2% by chance); the factor is modelled, the value derived'
- 'orderrows.UnitCost: ratio of ProductKey.Cost with the factor of UnitPrice (100.0% of rows reproduced)'
- 'customer: check days(StartDT) < days(EndDT) (holds on 100.0% of 20,000 sampled rows, 99.6% by chance)'
- 'orders: check days(DT) < days(CustomerKey.EndDT) (holds on 100.0% of 20,000 sampled rows with both dates, 96.9%
  by chance)'
- 'orders: check days(StoreKey.OpenDate) < days(DT) (holds on 100.0% of 20,000 sampled rows with both dates, 99.6%
  by chance)'
- 'orders: check days(DT) <= days(StoreKey.CloseDate) (holds on 100.0% of 237 sampled rows with both dates, 87.2%
  by chance)'
- 'orders: check days(DT) == days(DeliveryDate) or StoreKey == 999999 (equal on 100.0% of 11,636 sampled rows outside
  StoreKey = 999999, 0.0% by chance); and never equal for StoreKey = 999999: check days(DT) != days(DeliveryDate)
  or StoreKey != 999999'
- 'orders: check CustomerKey.Country == StoreKey.CountryCode or StoreKey == 999999 (equal on 100.0% of 11,636 sampled
  rows outside StoreKey = 999999, 31.1% by chance); and never equal for StoreKey = 999999: check CustomerKey.Country
  != StoreKey.CountryCode or StoreKey != 999999'
- 'product: check Cost < Price (holds on 100.0% of 2,517 sampled rows, 67.0% by chance)'
- 'orders: keys numbered in the order of DT (non-decreasing on 100.0% of 19,999 consecutive sampled keys, 50.1%
  by chance)'
- 'orderrows: role fact (anchor orders, partner product); check the anchor is the ''one'' side whose row counts
  should be preserved'
