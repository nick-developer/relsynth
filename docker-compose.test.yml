# Database servers for the integration tests (tests/integration).
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   export RELSYNTH_TEST_PG_URL=postgresql://relsynth:RelSynthTest1@localhost:5432/relsynth
#   export RELSYNTH_TEST_MSSQL_URL="mssql://sa:RelSynth_Test1!@localhost:1433/master?TrustServerCertificate=yes&driver=ODBC+Driver+18+for+SQL+Server"
#   export RELSYNTH_TEST_ORACLE_URL="oracle://relsynth:RelSynthTest1@localhost:1521/?service_name=FREEPDB1"
#   export RELSYNTH_TEST_MYSQL_URL=mysql://root:RelSynthTest1@localhost:3306/relsynth
#   export RELSYNTH_TEST_MARIADB_URL=mariadb://root:RelSynthTest1@localhost:3307/relsynth
#   export RELSYNTH_TEST_S3_ENDPOINT=http://localhost:9000 RELSYNTH_TEST_S3_KEY=test RELSYNTH_TEST_S3_SECRET=testtest  # MinIO
#   export RELSYNTH_TEST_AZURITE_ENDPOINT=http://localhost:10000
#   pytest tests/integration
#
# Test-only passwords: never reuse them for anything else.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relsynth
      POSTGRES_PASSWORD: RelSynthTest1
      POSTGRES_DB: relsynth
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relsynth"]
      interval: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RelSynth_Test1!"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RelSynth_Test1!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: RelSynthTest1
      APP_USER: relsynth
      APP_USER_PASSWORD: RelSynthTest1
    ports: ["1521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60

  # MySQL and MariaDB tests create and drop one database per test, hence root
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: RelSynthTest1
      MYSQL_DATABASE: relsynth
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pRelSynthTest1 --silent"]
      interval: 5s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: RelSynthTest1
      MARIADB_DATABASE: relsynth
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # object storage for the Iceberg and Delta connectors (tests/integration/test_lakehouse_stores.py)
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testtest
    ports: ["9000:9000"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports: ["10000:10000"]
