# Security scanners beyond CodeQL (codeql.yml) and the lint job's ruff S rules,
# bandit and pip-audit (ci.yml).  Each scanner uploads SARIF to Security > Code
# scanning, so its findings sit next to CodeQL's and annotate pull requests.
#
#   semgrep            Python, security-audit, secrets, Dockerfile and Actions rule packs
#                      (pull requests fail on new ERROR findings only: --baseline-commit)
#   gitleaks           secrets in the commits of a pull request or push
#   zizmor             GitHub Actions workflow security (template injection,
#                      unpinned actions, credential persistence, excessive permissions)
#   dependency-review  new dependencies with known vulnerabilities (high or critical)
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: "1.180.0"
  ZIZMOR_VERSION: "1.30.0"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: semgrep (all findings to code scanning)
        run: |
          semgrep scan --metrics=off --sarif -o semgrep.sarif \
            --config p/python --config p/security-audit --config p/secrets \
            --config p/dockerfile --config p/github-actions \
            --exclude tests --exclude bench/data || true
      - name: semgrep (new ERROR findings fail the pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --metrics=off --error --severity ERROR --baseline-commit "$BASE_SHA" \
            --config p/python --config p/security-audit --config p/secrets \
            --config p/dockerfile --config p/github-actions \
            --exclude tests --exclude bench/data
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with: { sarif_file: semgrep.sarif, category: semgrep }

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: gitleaks (commits of this pull request or push)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE_SHA..HEAD" ;;
            push) range="$BEFORE..HEAD"; git cat-file -e "$BEFORE" 2>/dev/null || range="HEAD~1..HEAD" ;;
            *) range="" ;;                                   # schedule and manual runs: whole history
          esac
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 \
            ${range:+--log-opts="$range"}

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install "zizmor==${ZIZMOR_VERSION}"
      - name: zizmor (report)
        run: zizmor --offline --format sarif .github/workflows > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: zizmor.sarif, category: zizmor }
      - name: zizmor (high-severity findings fail)
        run: zizmor --offline --min-severity high --min-confidence high .github/workflows

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
