name: bench

# The weekly and monthly tiers of the benchmark matrix (G7; bench/README.md lists
# the datasets of each tier and the features they cover): one job per dataset, or
# per seed group where a dataset needs more than one job, built by
# `python -m bench matrix --tier <tier>`, then the comparison with bench/baseline.json.
# The PR tier runs in ci.yml on every pull request. Datasets marked for a bigger
# runner (TPC-H SF100, Synthea 100k/1M) and the local tier (bi/COREP, research-only
# sets) run on the maintainer's machine: `python -m bench all --tier monthly`.
# The history records are uploaded; commit them with a baseline change.
# docs/development/benchmarks.md describes the harness and the regression rule.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 6"          # weekly tier, Saturdays
    - cron: "0 3 2 * *"          # monthly tier, on the 2nd
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (weekly or monthly)"
        default: weekly
        type: choice
        options: [weekly, monthly]
      seeds:
        description: "Seeds (default: each dataset's own)"
        default: ""
      only:
        description: "Comma-separated datasets of the tier to run (default: all; 'fake' is the statistical suite)"
        default: ""
      rebuild_baseline:
        description: "Commit a baseline built from this run's records to the dispatched branch (never main)"
        type: boolean
        default: false
      records_from_run:
        description: "With rebuild_baseline: take the records of this earlier run id instead of running the bench"
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}-${{ inputs.tier || (github.event.schedule == '0 3 2 * *' && 'monthly') || 'weekly' }}
  cancel-in-progress: false

env:
  TIER: ${{ inputs.tier || (github.event.schedule == '0 3 2 * *' && 'monthly') || 'weekly' }}

jobs:
  plan:
    if: ${{ !inputs.records_from_run }}
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.m.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[bench]"
      - id: m
        env:
          ONLY: ${{ inputs.only }}
        run: echo "parts=$(python -m bench matrix --tier "$TIER" --only "$ONLY")" >> "$GITHUB_OUTPUT"

  bench:
    # one job per dataset (in parallel), each within a hosted runner's 6 hours
    needs: plan
    if: ${{ !inputs.records_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,bench,benchmark]" datasketches
      - name: Free disk space for the large sets
        if: ${{ env.TIER == 'monthly' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/.cache
          key: bench-data-${{ matrix.part.datasets || 'fake' }}-${{ hashFiles('bench/datasets.py', 'bench/builders/**') }}
      - name: ${{ matrix.part.name }}
        env:
          SEEDS: ${{ inputs.seeds || matrix.part.seeds }}
          DATASETS: ${{ matrix.part.datasets }}
          FAKE: ${{ matrix.part.fake }}
        run: |
          # shellcheck disable=SC2086
          python -m bench run ${DATASETS:+--datasets $DATASETS} --seeds "$SEEDS" $FAKE --out-dir bench-out --label "$TIER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: "bench-history-${{ matrix.part.name }}", path: bench-out/ }

  compare:
    needs: bench
    if: ${{ always() && !inputs.records_from_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      # bench imports relsynth (relsynth._http since #50) and defusedxml (the bench extra)
      - run: pip install -e ".[bench]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # one folder per job: parallel jobs can write records of the same name
        with: { pattern: bench-history-*, path: bench-out }
      - name: Compare with the baseline (every dataset of the tier must run)
        env:
          ONLY: ${{ inputs.only }}
        run: python -m bench compare bench-out/*/*.json --full --tier "$TIER" --hosted --only "$ONLY"

  baseline:
    # A baseline change on the dispatched branch: the records of this run (or of
    # records_from_run) become bench/history/ files and bench/baseline.json, in a
    # signed-off commit that the pull request then reviews with the rest.
    needs: bench
    if: ${{ always() && inputs.rebuild_baseline && !inputs.only && github.ref != 'refs/heads/main' && needs.bench.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # no token left in .git/config for the steps below; only the push step gets it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      # bench imports relsynth (relsynth._http since #50) and defusedxml (the bench extra)
      - run: pip install -e ".[bench]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-history-*
          path: bench-out
          run-id: ${{ inputs.records_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build the baseline and commit it
        env:
          RUN: ${{ inputs.records_from_run || github.run_id }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # one folder per job (records of parallel jobs can share a name): prefix the job's part
          for f in bench-out/*/*.json; do
            part=$(basename "$(dirname "$f")"); cp "$f" "bench/history/${part#bench-history-}-$(basename "$f")"
          done
          python -m bench baseline bench-out/*/*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/baseline.json bench/history/
          git commit -s -m "chore(bench): baseline from bench run $RUN" \
            -m "Built by bench.yml (rebuild_baseline) from the records of run $RUN on GitHub-hosted runners."
          # the token is given to this one command and never written to .git/config, so no
          # later step or uploaded artifact can carry it (GitHub masks it in the log)
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
