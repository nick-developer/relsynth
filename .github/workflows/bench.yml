name: bench

# The full benchmark: every public golden database (Chinook, AdventureWorks DW,
# Contoso as SQLite and as Parquet) on five seeds and the statistical check
# suite, compared with bench/baseline.json. bi/COREP is private and runs only
# on the maintainer's machine (`python -m bench all` with RELSYNTH_BENCH_BI_DIR).
# The history record is uploaded; commit it with a baseline change.
# docs/development/benchmarks.md describes the harness and the regression rule.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds"
        default: "1,2,3,4,5"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,bench]" datasketches
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/.cache
          key: bench-data-${{ hashFiles('bench/datasets.py', 'bench/builders/**') }}
      - name: Golden databases and the statistical check suite
        env:
          SEEDS: ${{ inputs.seeds || '1,2,3,4,5' }}
        run: python -m bench run --seeds "$SEEDS" --out-dir bench-out --label weekly
      - name: Compare with the baseline (every dataset of the baseline must run)
        run: python -m bench compare "$(ls bench-out/*.json)" --full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: bench-history, path: bench-out/ }
