name: pypi_upload

# Publishes a GitHub release. Nothing is uploaded unless the complete CI gate
# (lint, types, unit, end-to-end, the three database servers, the statistical
# check suite and the wheel smoke test) passes for the released commit.
#
# Supply chain (docs/development/supply-chain.md):
#   * the wheel and sdist are built once, in the `build` job below;
#   * a CycloneDX SBOM is generated from a clean install of that wheel;
#   * the wheel, sdist and SBOM are signed with Sigstore (keyless, this
#     workflow's GitHub OIDC identity) and the bundles attached to the release;
#   * GitHub artifact attestations record SLSA v1 build provenance for the
#     artefacts and link the SBOM to the wheel (verify with `gh attestation verify`);
#   * PyPI trusted publishing uploads the same files with PEP 740 attestations.
#
# The file name is part of the PyPI trusted-publisher configuration (workflow
# "pypi_upload.yml", environment "pypi"): do not rename it.

on:
  release:
    types: [published]
  workflow_dispatch:             # a dry run: everything except the upload to PyPI and the release assets

permissions:
  contents: read

concurrency:
  group: pypi-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # the called workflow's signing job (skipped here) declares id-token: write,
    # and a caller must grant every permission a called job asks for
    permissions:
      contents: read
      id-token: write
    with:
      skip_sign: true

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 -c "import re, pathlib; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', pathlib.Path('src/relsynth/_version.py').read_text()).group(1))")
          echo "tag=$TAG  package=$VERSION"
          [ "${TAG#v}" = "$VERSION" ] || { echo "::error::release tag $TAG does not match package version $VERSION"; exit 1; }

  build:
    needs: [ci, check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # Sigstore signing and attestations
      attestations: write        # GitHub artifact attestations (SLSA provenance, SBOM)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install build twine cyclonedx-bom==7.5.0 sigstore==4.5.1
      - name: Build the wheel and sdist
        run: rm -rf dist && python -m build && twine check dist/*
      - name: CycloneDX SBOM of the installed wheel with every extra
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install "$(ls dist/*.whl)[all]"
          /tmp/v/bin/relsynth version --json
          mkdir -p meta
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library --output-reproducible \
            --of JSON -o meta/relsynth.cdx.json /tmp/v/bin/python
      - name: Sigstore signatures
        run: |
          python -m sigstore sign dist/*.whl dist/*.tar.gz meta/relsynth.cdx.json
          python -m sigstore verify identity --cert-identity "https://github.com/${{ github.workflow_ref }}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            dist/*.whl dist/*.tar.gz meta/relsynth.cdx.json
          mv dist/*.sigstore.json meta/
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: meta/relsynth.cdx.json
      - name: SHA-256 sums
        run: (cd dist && sha256sum *) > meta/SHA256SUMS && cat meta/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-dist, path: dist/ }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-meta, path: meta/ }

  release-assets:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write            # attach files to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-dist, path: dist/ }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-meta, path: meta/ }
      - name: Attach the artefacts, SBOM, signatures and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* meta/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relsynth/
    permissions:
      id-token: write            # trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
