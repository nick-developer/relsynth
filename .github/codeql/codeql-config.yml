# CodeQL configuration (see .github/workflows/codeql.yml)
name: relsynth CodeQL config

queries:
  - uses: security-extended
  - uses: security-and-quality

# Tests, benchmarks and examples are scanned by bandit/semgrep too, but their
# fixtures (fake credentials, temporary paths) would bury real findings here.
paths-ignore:
  - tests
  - bench/data
  - "**/__pycache__"
  - docs/proofs

# py/cyclic-import counts imports deferred into functions, which relsynth uses on
# purpose (optional drivers, heavy modules, callbacks into the engine) and which
# cannot fail at import time.  tests/unit/test_import_graph.py keeps the
# module-level import graph acyclic instead; py/unsafe-cyclic-import (a cycle
# whose module-level use can fail) stays on.
query-filters:
  - exclude:
      id: py/cyclic-import
